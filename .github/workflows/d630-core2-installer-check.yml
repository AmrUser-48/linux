name: Validate Core 2 smart installer

on:
  push:
    branches: [master]
    paths:
      - "README.md"
      - "core2-packages/README.md"
      - "core2-packages/install.py"
      - "core2-packages/update-index.py"
      - "core2-packages/release-notes.py"
      - "core2-packages/normalize-releases.py"
      - ".github/workflows/d630-core2-sox-ng.yml"
      - ".github/workflows/d630-core2-installer-check.yml"
      - ".github/workflows/build-with-deps.yml"
      - ".github/workflows/d630-core2-package.yml"
      - ".github/workflows/d630-core2-system-package.yml"
      - ".github/workflows/d630-core2-recover-release.yml"
      - ".github/workflows/d630-core2-prune-dev-debug.yml"
      - ".github/workflows/d630-core2-update-package.yml"
      - ".github/workflows/d630-core2-update-release-index.yml"
      - ".github/workflows/d630-core2-packages-series.yml"
      - ".github/workflows/d630-core2-system-packages-series.yml"
      - ".github/workflows/d630-core2-rustdesk.yml"
  pull_request:
    paths:
      - "README.md"
      - "core2-packages/README.md"
      - "core2-packages/install.py"
      - "core2-packages/update-index.py"
      - ".github/workflows/d630-core2-installer-check.yml"
      - ".github/workflows/build-with-deps.yml"
      - ".github/workflows/d630-core2-package.yml"
      - ".github/workflows/d630-core2-system-package.yml"
      - ".github/workflows/d630-core2-recover-release.yml"
      - ".github/workflows/d630-core2-prune-dev-debug.yml"
      - ".github/workflows/d630-core2-update-package.yml"
      - ".github/workflows/d630-core2-update-release-index.yml"
      - ".github/workflows/d630-core2-packages-series.yml"
      - ".github/workflows/d630-core2-system-packages-series.yml"
      - ".github/workflows/d630-core2-rustdesk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile core2-packages/install.py core2-packages/update-index.py core2-packages/release-notes.py core2-packages/normalize-releases.py

      - name: Parse affected package workflows as YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "YAML OK: #{path}" }' .github/workflows/build-with-deps.yml .github/workflows/d630-core2-package.yml .github/workflows/d630-core2-system-package.yml .github/workflows/d630-core2-recover-release.yml .github/workflows/d630-core2-prune-dev-debug.yml .github/workflows/d630-core2-update-package.yml .github/workflows/d630-core2-update-release-index.yml .github/workflows/d630-core2-packages-series.yml .github/workflows/d630-core2-system-packages-series.yml .github/workflows/d630-core2-rustdesk.yml .github/workflows/d630-core2-sox-ng.yml

      - name: Validate Bookworm video package source queue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/d630-core2-packages-series.yml").read_text(encoding="utf-8")
          start = workflow.index("            video)")
          start = workflow.index("packages=(", start) + len("packages=(")
          end = workflow.index(")", start)
          packages = workflow[start:end].split()
          required = {
              # DRM, VA-API, Mesa and X11/Wayland display stack
              "libdrm", "libpciaccess", "mesa", "libva", "intel-vaapi-driver",
              "intel-media-driver", "libvdpau", "libxvmc", "libxv", "libx11",
              "libxext", "libxrandr", "libxcomposite", "libxdamage", "wayland",
              "libepoxy",
              # SIMD image/raster and playback/rendering libraries
              "pixman", "orc", "libjpeg-turbo", "libpng1.6", "libwebp",
              "openjpeg2", "cairo", "glib2.0", "libsdl2", "libplacebo",
              "libass", "libopenmpt",
              # Bookworm source packages providing codecs and multimedia engines
              "dav1d", "aom", "svt-av1", "x264", "x265", "mpeg2dec",
              "xvidcore", "libtheora", "libvpx", "ffmpeg", "gstreamer1.0",
              "gst-plugins-base1.0", "gst-plugins-good1.0", "gst-plugins-bad1.0",
              "gst-libav1.0", "gstreamer-vaapi", "mpv", "vlc",
          }
          duplicates = sorted({package for package in packages if packages.count(package) > 1})
          missing = sorted(required - set(packages))
          if duplicates or missing:
              raise SystemExit(f"Video queue validation failed; duplicates={duplicates}, missing={missing}")
          print(f"Video queue contains {len(packages)} unique Bookworm source packages.")
          PY

      - name: Validate installed runtime package queues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/d630-core2-packages-series.yml").read_text(encoding="utf-8")

          def queue(series):
              start = workflow.index(f"            {series})")
              start = workflow.index("packages=(", start) + len("packages=(")
              end = workflow.index(")", start)
              return workflow[start:end].split()

          expected = {
              "runtime-extra": {
                  "libunwind", "lapack", "libarchive", "brotli", "libdeflate", "z3",
              },
              "audio-libraries": {
                  "alsa-lib", "pipewire", "pulseaudio", "flac", "libogg", "opus",
                  "libvorbis", "mpg123", "libsamplerate", "libsndfile", "soxr",
                  "speex", "speexdsp", "faad2", "shine", "libmad",
              },
              "image-libraries": {
                  "libavif", "libheif", "jpeg-xl", "libexif", "lcms2", "tiff",
                  "libwmf", "djvulibre",
              },
              "desktop-libraries": {
                  "fontconfig", "freetype", "harfbuzz", "fribidi", "pango",
                  "gdk-pixbuf", "gtk+2.0", "gtk+3.0", "libxft", "libxrender",
                  "libxfixes", "libxi", "libxinerama", "libxscrnsaver",
                  "libxkbcommon", "libxkbfile", "libxfont",
              },
              "java-runtime": {"openjdk-17"},
              "mesa-no-llvm": {"mesa"},
          }
          for series, required in expected.items():
              packages = queue(series)
              duplicates = sorted({name for name in packages if packages.count(name) > 1})
              missing = sorted(required - set(packages))
              if duplicates or missing:
                  raise SystemExit(
                      f"{series} queue validation failed; duplicates={duplicates}, missing={missing}"
                  )
              print(f"PASS: {series} has {len(packages)} unique source packages")

          if "gcc-12" in queue("runtime-extra"):
              raise SystemExit("gcc-12 must not be duplicated; its compiler/runtime build is handled separately")

          builder = Path(".github/workflows/d630-core2-package.yml").read_text(encoding="utf-8")
          required_mesa_contract = {
              "Mesa source disables LLVM architecture build": 'sed -i -E \'s/^LLVM_ARCHS[[:space:]]*=.*/LLVM_ARCHS =/\' "$RULES"' in builder,
              "Mesa config enables Crocus and i915 for GM965/X3100 without LLVM": "CORE2_D630_NO_LLVM" in builder and "GALLIUM_DRIVERS := swrast crocus i915" in builder,
              "Mesa disables Vulkan driver output": "VULKAN_DRIVERS :=" in builder and "VULKAN_LAYERS :=" in builder,
              "Mesa release rejects libllvm15 dependencies": 'grep -qw "libllvm15"' in builder,
              "Mesa package validation requires Crocus for GM965": 'grep "/crocus_dri.so"' in builder and 'LLVM-free Mesa artifact omitted the required Intel Crocus Gallium driver' in builder,
              "mesa-no-llvm forces a replacement build": '"mesa-no-llvm" ]] && force_rebuild=true' in workflow,
          }
          for label, passed in required_mesa_contract.items():
              print(("PASS" if passed else "FAIL") + ": " + label)
          failures = [label for label, passed in required_mesa_contract.items() if not passed]
          if failures:
              raise SystemExit(f"Mesa no-LLVM validation failed: {failures}")
          PY

      - name: Validate RustDesk Core 2 build contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/d630-core2-rustdesk.yml").read_text()
          required = {
              "Debian 12 build container": "image: debian:12" in workflow,
              "official RustDesk source": "repository: rustdesk/rustdesk" in workflow,
              "stable 1.4.9 default": 'default: "1.4.9"' in workflow,
              "Core 2 C compiler flags": "-march=core2 -mtune=core2" in workflow,
              "Core 2 Rust target": "-C target-cpu=core2" in workflow,
              "strip ELF symbols": "strip --strip-unneeded" in workflow,
              "uses upstream Flutter Debian packaging": "python3 build.py --flutter --hwcodec --unix-file-copy-paste" in workflow,
              "required Bookworm runtime dependencies": all(x in workflow for x in (
                  "libgtk-3-0", "libxcb-randr0", "libxdo3", "libxfixes3",
                  "libxcb-shape0", "libxcb-xfixes0", "libasound2", "libsystemd0",
                  "libva2", "libva-drm2", "libva-x11-2",
                  "libgstreamer-plugins-base1.0-0", "gstreamer1.0-pipewire"
              )),
              "publishes package and checksums": "SHA256SUMS-core2-rustdesk.txt" in workflow and "gh release create" in workflow,
              "does not enable special DRM feature": "--drm" not in workflow and "drm-wake" not in workflow,
              "workflow-scoped push trigger": (
                  "workflow_dispatch:" in workflow
                  and "  push:" in workflow
                  and "      - '.github/workflows/d630-core2-rustdesk.yml'" in workflow
              ),
          }
          for label, passed in required.items():
              print(("PASS" if passed else "FAIL") + ": " + label)
          failures = [label for label, passed in required.items() if not passed]
          if failures:
              raise SystemExit(f"{len(failures)} RustDesk workflow validation(s) failed")
          PY

      - name: Check updater Bash-script syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -rtempfile <<'RUBY'
          workflow = YAML.load_file(".github/workflows/d630-core2-update-package.yml", aliases: true)
          workflow.fetch("jobs").each do |job_name, job|
            (job["steps"] || []).each_with_index do |step, index|
              next unless step.is_a?(Hash) && step["shell"].to_s.start_with?("bash") && step["run"]
              source = step["run"].gsub(/\$\{\{.*?\}\}/m, "SAFE_VALUE")
              Tempfile.create(["core2-updater-#{job_name}-#{index}", ".sh"]) do |file|
                file.write(source)
                file.close
                unless system("bash", "-n", file.path)
                  abort("Bash syntax error in updater step: #{step["name"]}")
                end
              end
            end
          end
          puts "Updater Bash-script syntax checks passed."
          RUBY

      - name: Test package index generator and refresh hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile

          root = pathlib.Path("README.md").read_text(encoding="utf-8")
          readme_path = pathlib.Path("core2-packages/README.md").read_text(encoding="utf-8")
          index_workflow = pathlib.Path(".github/workflows/d630-core2-update-release-index.yml").read_text(encoding="utf-8")
          package_workflow = pathlib.Path(".github/workflows/d630-core2-package.yml").read_text(encoding="utf-8")
          system_workflow = pathlib.Path(".github/workflows/d630-core2-system-package.yml").read_text(encoding="utf-8")
          updater = pathlib.Path(".github/workflows/d630-core2-update-package.yml").read_text(encoding="utf-8")
          assert "(core2-packages/README.md)" in root and "core2-packages/README.md" in root, "root README must link to the package browser"
          assert readme_path.count("<!-- CORE2-PACKAGE-RELEASE-INDEX:START -->") == 1
          assert readme_path.count("<!-- CORE2-PACKAGE-RELEASE-INDEX:END -->") == 1
          assert readme_path.count("<!-- CORE2-PACKAGE-DEPENDENCY-TREE:START -->") == 1
          assert readme_path.count("<!-- CORE2-PACKAGE-DEPENDENCY-TREE:END -->") == 1
          assert "update-index.py" in index_workflow
          assert "normalize-releases.py" in index_workflow, "one refresh action must normalize notes and rebuild the index/tree"
          assert not pathlib.Path(".github/workflows/d630-core2-normalize-releases.yml").exists(), "release normalization must use the single index refresh action"
          assert "dependency-metadata.json" in index_workflow
          assert "workflow_dispatch:" in index_workflow
          assert "release:" in index_workflow and "types: [published]" in index_workflow
          assert "refresh_index" in package_workflow and "d630-core2-update-release-index.yml" in package_workflow
          assert "refresh_index" in system_workflow and "d630-core2-update-release-index.yml" in system_workflow
          assert '--field "refresh_index=false"' in updater

          releases = [
              {
                  "tag_name": "core2-python3.11-3.11.2-core2.1-20261010000000",
                  "name": "Core 2 optimized python3.11 3.11.2-1+core2.1~20261010000000",
                  "published_at": "2026-10-10T00:00:00Z",
                  "html_url": "https://github.com/AmrUser-48/linux/releases/tag/test-python",
                  "assets": [
                      {"id": 1, "name": "python3.11_3.11.2-1_amd64.deb", "browser_download_url": "https://example.invalid/python.deb"},
                      {"id": 2, "name": "python3.11-dev_3.11.2-1_amd64.deb", "browser_download_url": "https://example.invalid/python-dev.deb"},
                      {"id": 20, "name": "python3.11-dbg_3.11.2-1_amd64.deb", "browser_download_url": "https://example.invalid/python-dbg.deb"},
                      {"id": 21, "name": "python3.11-dbgsym_3.11.2-1_amd64.deb", "browser_download_url": "https://example.invalid/python-dbgsym.deb"},
                      {"name": "python3.11_3.11.2.orig.tar.gz", "browser_download_url": "https://example.invalid/source.tar.gz"},
                      {"name": "python3.11_3.11.2.dsc", "browser_download_url": "https://example.invalid/source.dsc"},
                      {"name": "BUILD-INFO.txt", "browser_download_url": "https://example.invalid/BUILD-INFO.txt"},
                      {"name": "SHA256SUMS-core2-python3.11.txt", "browser_download_url": "https://example.invalid/SHA256SUMS.txt"}
                  ]
              },
              {
                  "tag_name": "core2-system-kmod-30-20221128-1-core2.1-20261010010000",
                  "name": "Core 2 system kmod 30+20221128-1+core2.1~20261010010000",
                  "published_at": "2026-10-10T01:00:00Z",
                  "html_url": "https://github.com/AmrUser-48/linux/releases/tag/test-kmod-system",
                  "assets": [
                      {"id": 3, "name": "kmod_30+20221128-1+core2.1.20261010010000_amd64.deb", "browser_download_url": "https://example.invalid/kmod-system.deb"},
                      {"name": "BUILD-INFO.txt", "browser_download_url": "https://example.invalid/BUILD-INFO.txt"}
                  ]
              },
              {
                  "tag_name": "core2-kmod-30-20221128-1-core2.1-20261010003000",
                  "name": "Core 2 optimized kmod 30+20221128-1+core2.1~20261010003000",
                  "published_at": "2026-10-10T00:30:00Z",
                  "html_url": "https://github.com/AmrUser-48/linux/releases/tag/test-kmod-optimized",
                  "assets": [
                      {"id": 4, "name": "kmod_30+20221128-1+core2.1.20261010003000_amd64.deb", "browser_download_url": "https://example.invalid/kmod-optimized.deb"},
                      {"name": "BUILD-INFO.txt", "browser_download_url": "https://example.invalid/BUILD-INFO.txt"}
                  ]
              }
          ]
          metadata = {
              "schema": 1,
              "assets": {
                  "1": {"package": "python3.11", "version": "3.11.2-1+core2.1~20261010000000",
                        "architecture": "amd64", "pre_depends": "", "depends": "libc6 (>= 2.34)",
                        "provides": "", "asset_name": "python3.11_3.11.2-1_amd64.deb"},
                  "2": {"package": "python3.11-dev", "version": "3.11.2-1+core2.1~20261010000000",
                        "architecture": "amd64", "pre_depends": "", "depends": "python3.11 (= 3.11.2-1+core2.1~20261010000000)",
                        "provides": "", "asset_name": "python3.11-dev_3.11.2-1_amd64.deb"},
                  "3": {"package": "kmod", "version": "30+20221128-1+core2.1~20261010010000",
                        "architecture": "amd64", "pre_depends": "", "depends": "libkmod2 (>= 30)",
                        "provides": "", "asset_name": "kmod_30+20221128-1+core2.1.20261010010000_amd64.deb"}
              }
          }

          with tempfile.TemporaryDirectory() as tmp:
              temp = pathlib.Path(tmp)
              readme = temp / "README.md"
              readme.write_text(
                  "header\n"
                  "<!-- CORE2-PACKAGE-DEPENDENCY-TREE:START -->\n"
                  "<!-- CORE2-PACKAGE-DEPENDENCY-TREE:END -->\n"
                  "<!-- CORE2-PACKAGE-RELEASE-INDEX:START -->\n"
                  "<!-- CORE2-PACKAGE-RELEASE-INDEX:END -->\nfooter\n",
                  encoding="utf-8",
              )
              release_file = temp / "releases.json"
              release_file.write_text(json.dumps(releases), encoding="utf-8")
              metadata_file = temp / "dependency-metadata.json"
              metadata_file.write_text(json.dumps(metadata), encoding="utf-8")
              subprocess.run([
                  sys.executable, "core2-packages/update-index.py",
                  str(readme), str(metadata_file), str(release_file)
              ], check=True)
              result = readme.read_text(encoding="utf-8")
              assert result.startswith("header\n") and result.rstrip().endswith("footer")
              assert result.index("### kmod (system)") < result.index("### python3.11 (optimized)"), "latest source releases must be newest first"
              assert "### kmod (optimized)" not in result, "README should not list historical duplicate releases"
              assert "python3 - python3.11" in result
              assert "python3 - kmod" in result
              install_lines = [line for line in result.splitlines() if line.startswith("Install/update latest:")]
              assert len(install_lines) == 2, install_lines
              assert all("--kind" not in line for line in install_lines), install_lines
              assert sum("python3 - kmod" in line for line in install_lines) == 1, install_lines
              assert "python3.11_3.11.2-1_amd64.deb" in result
              assert "python3.11-dev_3.11.2-1_amd64.deb" not in result, "secondary .deb assets belong on the release page"
              assert "https://github.com/AmrUser-48/linux/releases/tag/test-python" in result, "release page provides build metadata, checksums, and full notes"
              for forbidden in ("python3.11-dbg_", "python3.11-dbgsym_", ".orig.tar.gz", ".dsc"):
                  assert forbidden not in result, f"forbidden asset leaked into index: {forbidden}"
              assert "**Main .deb:**" in result
              assert "All files, checksums and historical builds" in result
              assert "**Runtime binary packages in tree:** 2." in result
              tree_start = result.index("<!-- CORE2-PACKAGE-DEPENDENCY-TREE:START -->")
              tree_end = result.index("<!-- CORE2-PACKAGE-DEPENDENCY-TREE:END -->")
              tree_result = result[tree_start:tree_end]
              assert "Depends" in tree_result
              assert "libc6 (&gt;= 2.34)" in tree_result
              assert "<em>(Debian Bookworm)</em>" in tree_result
              assert "python3.11-dev" not in tree_result, "development packages must not appear in the runtime tree"
              assert "https://example.invalid/python-dev.deb" not in result, "secondary download should be on the release page"
              assert "https://example.invalid/python.deb" in result, "primary package download should be linked directly"
              assert "<summary>System &amp; libraries (1 packages)</summary>" in tree_result
              assert "python3.11" in result and "kmod" in result
              assert "python3.11-dev" not in result, "download index should not repeat secondary package details"
              assert "3.11.2-1" in result and "30+20221128-1" in result
              assert "libkmod2 (&gt;= 30)" in tree_result, "dependency version constraints must be preserved"
              assert "python3.11_3.11.2-1_amd64.deb" in result, "the package index must retain the actual installable asset"
              cache = json.loads(metadata_file.read_text(encoding="utf-8"))
              assert set(cache["assets"]) == {"1", "2", "3"}, cache["assets"]
          print("Package index and dependency-tree checks passed.")
          PY

      - name: Test release selector and Debian asset parsing
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path

          installer = runpy.run_path("core2-packages/install.py", run_name="installer_test")
          treegen = runpy.run_path("core2-packages/update-index.py", run_name="dependency_tree_test")
          package_builder = Path(".github/workflows/d630-core2-package.yml").read_text(encoding="utf-8")
          relation_names = treegen["relationship_names"](
              "libdrm-intel1 (>= 2.4.0), libdrm2, libfoo1 | libfoo2 [amd64]"
          )
          assert relation_names == ["libdrm-intel1", "libdrm2", "libfoo1", "libfoo2"], relation_names
          sample_nodes = [
              {"package": "libgl1-mesa-dri", "version": "22.3.6-1+core2.1~20261016000000",
               "depends": "libdrm-intel1 (>= 2.4.0), libdrm2", "published_at": "2026-10-16"},
              {"package": "libdrm-intel1", "version": "2.4.114-1+core2.1~20261016000000",
               "depends": "libdrm2", "published_at": "2026-10-16"},
              {"package": "libdrm2", "version": "2.4.114-1+core2.1~20261016000000",
               "depends": "", "published_at": "2026-10-16"},
          ]
          tree_rows, tree_count = treegen["build_tree_rows"](sample_nodes)
          assert tree_count == 3, (tree_rows, tree_count)
          assert any("libgl1-mesa-dri" in row and row.rstrip().endswith("22.3.6-1") for row in tree_rows), tree_rows
          assert any("libdrm-intel1" in row and row.rstrip().endswith("2.4.114-1") for row in tree_rows), tree_rows
          assert any("libdrm2 [shared dependency]" in row for row in tree_rows), tree_rows

          sox_nodes = [
              {"package": "sox-ng", "version": "14.8.1+core2.1~20261023214105",
               "depends": "libsox-ng5 (= 14.8.1+core2.1~20261023214105), libc6 (>= 2.34)",
               "published_at": "2026-10-23", "asset_name": "sox-ng_14.8.1+core2.1.20261023214105_amd64.deb",
               "architecture": "amd64", "download_url": "https://example.invalid/sox-ng.deb", "release_url": "https://example.invalid/sox-ng-release"},
              {"package": "libsox-ng5", "version": "14.8.1+core2.1~20261023214105",
               "depends": "libebur128-1 (>= 1.0.1), libao4 (>= 1.1.0)",
               "published_at": "2026-10-23", "asset_name": "libsox-ng5_14.8.1+core2.1.20261023214105_amd64.deb",
               "architecture": "amd64", "download_url": "https://example.invalid/libsox-ng5.deb", "release_url": "https://example.invalid/libsox-ng5-release"},
              {"package": "libebur128-1", "version": "1.2.6-1+core2.1~20261023221125",
               "depends": "libc6 (>= 2.29)", "published_at": "2026-10-24",
               "asset_name": "libebur128-1_1.2.6-1+core2.1.20261023221125_amd64.deb",
               "architecture": "amd64", "download_url": "https://example.invalid/libebur128.deb", "release_url": "https://example.invalid/libebur128-release"},
          ]
          sox_tree, sox_count = treegen["build_tree_markdown"](sox_nodes)
          sox_result = chr(10).join(sox_tree)
          assert sox_count == 3, sox_count
          assert "**Verified SoX NG dependency path:** <code>sox-ng</code> → <code>libsox-ng5</code> → <code>libebur128-1</code>" in sox_result, "the transitive path must be derived from package control metadata"
          assert "#core2-package-libsox-ng5" in sox_result and "#core2-package-libebur128-1" in sox_result, "Core 2 dependency links should jump to the next package entry"
          assert "libao4 (&gt;= 1.1.0)" in sox_result, "stock Debian dependencies must be shown, not omitted"
          assert "https://example.invalid/libebur128-release" in sox_result, "the package entry should still link to its release page"
          assert installer["PRIMARY"]["libdrm"] == ["libdrm2", "libdrm-intel1"]
          assert "libdrm-amdgpu1|libdrm-radeon1" in package_builder
          assert "Dropping non-Intel GPU package from the D630 libdrm release" in package_builder
          assert "libdrm2_found" in package_builder and "libdrm_intel_found" in package_builder

          key, version = installer["package_and_version"]({
              "name": "Core 2 system glibc 2.36-9+deb12u14+core2.1~20261010052854"
          })
          assert key == "glibc", (key, version)
          assert version == "2.36-9+deb12u14+core2.1~20261010052854", version

          key, version = installer["package_and_version"]({
              "name": "Core 2 optimized rust-ripgrep 13.0.0-4+core2.1~20261009115443"
          })
          assert key == "rust-ripgrep", (key, version)
          assert version == "13.0.0-4+core2.1~20261009115443", version

          parsed = installer["parse_deb_asset"]({
              "name": "libc6-dev-x32_2.36-9+deb12u14+core2.1.20261010052854_amd64.deb"
          })
          assert parsed["package"] == "libc6-dev-x32", parsed
          assert parsed["arch"] == "amd64", parsed
          assert parsed["version"] == "2.36-9+deb12u14+core2.1~20261010052854", parsed

          kmod_asset = installer["parse_deb_asset"]({
              "name": "kmod_30+20221128-1+core2.1.20261009193535_amd64.deb"
          })
          assert kmod_asset["version"] == "30+20221128-1+core2.1~20261009193535", kmod_asset
          assert installer["canonicalize_asset_version"]("30+20221128-1+core2.1~20261009193535") == kmod_asset["version"]

          # Debian asset filenames omit the epoch that dpkg metadata retains.
          intel_asset = installer["parse_deb_asset"](
              {"name": "xserver-xorg-video-intel_2.99.917+git20210115-1+core2.1.20261016113213_amd64.deb"},
              "2:2.99.917+git20210115-1+core2.1~20261016113213",
          )
          assert intel_asset["version"] == "2:2.99.917+git20210115-1+core2.1~20261016113213", intel_asset
          assert installer["PRIMARY"]["xserver-xorg-input-keyboard"] == ["xserver-xorg-input-kbd"]
          assert installer["canonicalize_asset_version"]("30+20221128-1+core2.1.20261009193535") == kmod_asset["version"]

          # dpkg-deb emits labeled fields, not bare values.
          fields = installer["parse_dpkg_deb_fields"](
              "Package: kmod\n"
              "Version: 30+20221128-1+core2.1~20261009193535\n"
              "Architecture: amd64\n"
          )
          assert fields["package"] == "kmod", fields
          assert installer["canonicalize_asset_version"](fields["version"]) == kmod_asset["version"], fields

          assert installer["PRIMARY"]["glibc"] == ["libc6"]
          assert installer["release_kind_from_tag"]("core2-kmod-30.1") == "optimized"
          assert installer["release_kind_from_tag"]("core2-system-kmod-30.1") == "system"
          assert installer["release_kind_from_tag"]("unrelated-tag") is None
          assert installer["is_debug_package"]("libc6-dbg")
          assert installer["is_debug_package"]("libc6-dbgsym")
          assert not installer["is_debug_package"]("libc6-dev")
          assert not installer["is_debug_package"]("python3.11")
          print("Installer syntax and selection parsing checks passed.")
          PY
