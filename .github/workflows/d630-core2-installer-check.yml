name: Validate Core 2 smart installer

on:
  push:
    branches: [master]
    paths:
      - "core2-packages/install.py"
      - ".github/workflows/d630-core2-installer-check.yml"
      - ".github/workflows/d630-core2-package.yml"
      - ".github/workflows/d630-core2-system-package.yml"
      - ".github/workflows/d630-core2-recover-release.yml"
      - ".github/workflows/d630-core2-prune-dev-debug.yml"
      - ".github/workflows/d630-core2-update-package.yml"
  pull_request:
    paths:
      - "core2-packages/install.py"
      - ".github/workflows/d630-core2-installer-check.yml"
      - ".github/workflows/d630-core2-package.yml"
      - ".github/workflows/d630-core2-system-package.yml"
      - ".github/workflows/d630-core2-recover-release.yml"
      - ".github/workflows/d630-core2-prune-dev-debug.yml"
      - ".github/workflows/d630-core2-update-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile core2-packages/install.py

      - name: Parse affected package workflows as YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "YAML OK: #{path}" }' .github/workflows/d630-core2-package.yml .github/workflows/d630-core2-system-package.yml .github/workflows/d630-core2-recover-release.yml .github/workflows/d630-core2-prune-dev-debug.yml .github/workflows/d630-core2-update-package.yml

      - name: Check updater Bash-script syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -rtempfile <<'RUBY'
          workflow = YAML.load_file(".github/workflows/d630-core2-update-package.yml", aliases: true)
          workflow.fetch("jobs").each do |job_name, job|
            (job["steps"] || []).each_with_index do |step, index|
              next unless step.is_a?(Hash) && step["shell"].to_s.start_with?("bash") && step["run"]
              source = step["run"].gsub(/\$\{\{.*?\}\}/m, "SAFE_VALUE")
              Tempfile.create(["core2-updater-#{job_name}-#{index}", ".sh"]) do |file|
                file.write(source)
                file.close
                unless system("bash", "-n", file.path)
                  abort("Bash syntax error in updater step: #{step["name"]}")
                end
              end
            end
          end
          puts "Updater Bash-script syntax checks passed."
          RUBY

      - name: Check package list uses direct GitHub Releases links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("README.md").read_text(encoding="utf-8")
          packages = Path("core2-packages/README.md").read_text(encoding="utf-8")
          updater = Path(".github/workflows/d630-core2-update-package.yml").read_text(encoding="utf-8")
          target = "https://github.com/AmrUser-48/linux/releases"
          assert target in root, "root README is missing the direct package list link"
          assert target in packages, "package README is missing the direct package list link"
          assert "CORE2-PACKAGE-RELEASE-INDEX" not in packages, "large generated index should be removed"
          assert "d630-core2-update-release-index.yml" not in updater, "package updater should not dispatch a slow index refresh"
          assert "actions/workflows/" not in root, "root README package navigation must not open Actions"
          print("Direct package-list links and no index refresh dispatch: OK")
          PY

      - name: Test release selector and Debian asset parsing
        run: |
          python3 - <<'PY'
          import runpy

          installer = runpy.run_path("core2-packages/install.py", run_name="installer_test")

          key, version = installer["package_and_version"]({
              "name": "Core 2 system glibc 2.36-9+deb12u14+core2.1~20261010052854"
          })
          assert key == "glibc", (key, version)
          assert version == "2.36-9+deb12u14+core2.1~20261010052854", version

          key, version = installer["package_and_version"]({
              "name": "Core 2 optimized rust-ripgrep 13.0.0-4+core2.1~20261009115443"
          })
          assert key == "rust-ripgrep", (key, version)
          assert version == "13.0.0-4+core2.1~20261009115443", version

          parsed = installer["parse_deb_asset"]({
              "name": "libc6-dev-x32_2.36-9+deb12u14+core2.1.20261010052854_amd64.deb"
          })
          assert parsed["package"] == "libc6-dev-x32", parsed
          assert parsed["arch"] == "amd64", parsed
          assert parsed["version"] == "2.36-9+deb12u14+core2.1~20261010052854", parsed

          kmod_asset = installer["parse_deb_asset"]({
              "name": "kmod_30+20221128-1+core2.1.20261009193535_amd64.deb"
          })
          assert kmod_asset["version"] == "30+20221128-1+core2.1~20261009193535", kmod_asset
          assert installer["canonicalize_asset_version"]("30+20221128-1+core2.1~20261009193535") == kmod_asset["version"]
          assert installer["canonicalize_asset_version"]("30+20221128-1+core2.1.20261009193535") == kmod_asset["version"]

          # dpkg-deb emits labeled fields, not bare values.
          fields = installer["parse_dpkg_deb_fields"](
              "Package: kmod\n"
              "Version: 30+20221128-1+core2.1~20261009193535\n"
              "Architecture: amd64\n"
          )
          assert fields["package"] == "kmod", fields
          assert installer["canonicalize_asset_version"](fields["version"]) == kmod_asset["version"], fields

          assert installer["PRIMARY"]["glibc"] == ["libc6"]
          assert installer["release_kind_from_tag"]("core2-kmod-30.1") == "optimized"
          assert installer["release_kind_from_tag"]("core2-system-kmod-30.1") == "system"
          assert installer["release_kind_from_tag"]("unrelated-tag") is None
          assert installer["is_debug_package"]("libc6-dbg")
          assert installer["is_debug_package"]("libc6-dbgsym")
          assert not installer["is_debug_package"]("libc6-dev")
          assert not installer["is_debug_package"]("python3.11")
          print("Installer syntax and selection parsing checks passed.")
          PY
