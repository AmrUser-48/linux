name: Stop obsolete Core2 Brave build

on:
  push:
    paths:
      - .github/workflows/stop-brave-build.yml

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel obsolete Brave build run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run cancel 39965864015 --repo "$REPOSITORY"
          echo "Cancellation requested for obsolete Brave build run 39965864015."
