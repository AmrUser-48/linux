name: Build Brave Browser from source for Core 2
run-name: "Core2 Brave source build"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Brave stable version (for example 1.97.59), or latest
        required: true
        default: latest
        type: string
      compact_state:
        description: Consolidate checkpoint deltas into one verified full snapshot and prune old assets
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - .github/workflows/d630-core2-brave-source.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: core2-brave-source
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package Brave for Core 2
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Free disk space and disable swap completely
        shell: bash
        run: |
          set -euo pipefail
          # No swap during compilation: page-out would slow the Core 2-targeted build.
          sudo swapoff -a
          sudo rm -f /swapfile-brave /swapfile
          ACTIVE_SWAP="$(awk 'NR > 1 {n++} END {print n+0}' /proc/swaps)"
          if (( ACTIVE_SWAP != 0 )); then
            cat /proc/swaps
            echo "::error::Swap is still active; refusing to continue."
            exit 1
          fi

          echo "=== Disk usage before cleanup ==="
          df -h "$GITHUB_WORKSPACE"
          echo "=== Removing unrelated preinstalled SDKs ==="
          for path in \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Go \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/Perl \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/PHP \
            /opt/hostedtoolcache/Swift \
            /usr/share/swift \
            /usr/local/swift \
            /usr/local/go; do
            if sudo test -e "$path"; then
              sudo du -sh "$path" 2>/dev/null || true
              sudo rm -rf "$path"
            fi
          done
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"

          FREE_GB="$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -cd '0-9')"
          if (( FREE_GB < 100 )); then
            echo "::error::Only $FREE_GB GiB free after SDK cleanup; Chromium source builds require about 100 GiB."
            exit 1
          fi
          echo "Swap is disabled; $FREE_GB GiB disk space is available before sync/build."
          free -h
      - name: Install source-build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates curl dpkg-dev file git gh jq \
            python3 xz-utils zstd
          sudo apt-get clean

      - name: Select and verify upstream stable source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERSION_INPUT" == "latest" ]]; then
            API_URL="https://api.github.com/repos/brave/brave-browser/releases/latest"
          else
            VERSION="$(printf '%s' "$VERSION_INPUT" | sed 's/^v//')"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be 'latest' or a stable version such as 1.97.59."
              exit 1
            fi
            API_URL="https://api.github.com/repos/brave/brave-browser/releases/tags/v$VERSION"
          fi
          RELEASE_JSON="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'User-Agent: AmrUser-48-linux-core2-brave-source-build' \
            "$API_URL")"
          TAG="$(jq -er '.tag_name' <<<"$RELEASE_JSON")"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ "$(jq -r '.draft' <<<"$RELEASE_JSON")" != "false" ]] ||
             [[ "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" != "false" ]]; then
            echo "::error::Upstream response is not a stable Brave release: $TAG"
            exit 1
          fi
          VERSION="$(printf '%s' "$VERSION_INPUT" | sed 's/^v//')"
          if [[ "$VERSION_INPUT" != "latest" && "$TAG" != "v$VERSION" ]]; then
            echo "::error::Requested source version does not match upstream tag $TAG."
            exit 1
          fi
          UPSTREAM_VERSION="$(printf '%s' "$TAG" | sed 's/^v//')"
          {
            echo "upstream_tag=$TAG"
            echo "upstream_version=$UPSTREAM_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned Brave source tag: $TAG"

      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Clone Brave source and initialize Chromium dependencies
        id: sync
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE"
          mkdir -p "$WORK/src"
          git clone --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/brave/brave-core.git "$WORK/src/brave"
          cd "$WORK/src/brave"

          # Public-build placeholders allow compilation without private service credentials.
          # Some API-dependent features may be unavailable in this personal build.
          cat > .env <<'EOF'
          is_brave_release_build=0
          gn_args_is_official_build=true
          gn_args_symbol_level=0
          gn_args_blink_symbol_level=0
          gn_args_v8_symbol_level=0
          gn_args_brave_google_api_endpoint=https://www.googleapis.com/geolocation/v1/geolocate?key=
          gn_args_brave_google_api_key=core2-local-build
          gn_args_brave_pref_hash_seed=core2-local-build
          gn_args_brave_services_key=core2-local-build
          gn_args_brave_services_key_id=core2-local-build
          gn_args_brave_stats_api_key=core2-local-build
          gn_args_brave_stats_updater_url=https://updates.bravesoftware.com/service/update2
          gn_args_brave_sync_endpoint=https://sync-v2.brave.com/v2
          gn_args_brave_variations_server_url=https://variations.brave.com/seed
          gn_args_dcheck_always_on=false
          gn_args_email_aliases_api_key=core2-local-build
          gn_args_google_default_client_id=core2-local-build
          gn_args_google_default_client_secret=core2-local-build
          gn_args_goma_server_host=
          gn_args_safebrowsing_api_endpoint=safebrowsing.brave.com
          gn_args_service_key_aichat=core2-local-build
          gn_args_service_key_stt=core2-local-build
          gn_args_service_key_search=core2-local-build
          EOF

          npm install --global pnpm@11.11.0
          pnpm --version

          run_with_heartbeat() {
            local log_path="$1"
            shift
            "$@" >"$log_path" 2>&1 &
            local pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              sleep 60
              echo "Still running: $*"
              df -h "$GITHUB_WORKSPACE"
              free -h
              tail -n 3 "$log_path" || true
            done
            if wait "$pid"; then
              tail -n 35 "$log_path" || true
            else
              local rc=$?
              echo "::error::Command failed: $*"
              tail -n 160 "$log_path" || true
              return "$rc"
            fi
          }

          run_with_heartbeat "$WORK/pnpm-install.log" pnpm install --frozen-lockfile

          # Brave's sync script supports --no-history to avoid full Git histories.
          run_with_heartbeat "$WORK/brave-sync.log" \
            node ./build/commands/scripts/sync.ts --init --no-history
          echo "source_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if ! ./src/build/install-build-deps.sh >"$GITHUB_WORKSPACE/build-deps.log" 2>&1; then
            echo "::error::Brave/Chromium build dependency installation failed."
            tail -n 160 "$GITHUB_WORKSPACE/build-deps.log" || true
            exit 1
          fi
          tail -n 45 "$GITHUB_WORKSPACE/build-deps.log"
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"

      - name: Configure all x64 compiler targets for Core 2
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$GITHUB_WORKSPACE/src/build/config/compiler_cpu_abi.gn"
          test -f "$CONFIG"
          python3 - "$CONFIG" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          anchor = '    cpu_abi_cflags += [ "-msse3" ]'
          replacement = '''    cpu_abi_cflags += [
              "-msse3",
              "-march=core2",
              "-mtune=core2",
            ]'''
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f"Expected exactly one x64 ABI flag anchor; found {count}. Refusing a broad compiler-config edit.")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
          grep -qF '"-march=core2"' "$CONFIG"
          grep -qF '"-mtune=core2"' "$CONFIG"
          echo "Core 2 flags inserted into Chromium's common x64 compiler ABI flags."
          sed -n '/if (current_cpu == "x64") {/,/} else if (current_cpu == "x86") {/p' "$CONFIG" | head -n 24

      - name: Restore incremental Chromium build state
        id: state
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE"
          OUT="$WORK/src/out/Release"
          STATE_TAG="core2-brave-state-v${UPSTREAM_VERSION}"
          STATE_DIR="$RUNNER_TEMP/brave-state"
          mkdir -p "$OUT" "$STATE_DIR"

          # Checkpointed outputs retain mtimes from earlier runners. A fresh source
          # checkout makes unchanged inputs look newer, causing Ninja to recompile
          # previously completed objects. Normalize input mtimes to a fixed old epoch;
          # keep the entire output tree untouched so restored outputs remain newer.
          find "$WORK/src" \
            -path '*/.git' -prune -o \
            -path "$WORK/src/out" -prune -o \
            -type f -exec touch -d '@946684800' {} +
          echo "Normalized source/input mtimes for incremental checkpoint reuse."

          CHROMIUM_REVISION="$(git -C "$WORK/src" rev-parse HEAD)"
          CPU_CONFIG_SHA="$(sha256sum "$WORK/src/build/config/compiler_cpu_abi.gn" | awk '{print $1}')"
          ENV_SHA="$(sha256sum "$WORK/src/brave/.env" | awk '{print $1}')"
          BUILD_ARGS='Release;symbol_level=0;blink_symbol_level=0;v8_symbol_level=0;use_debug_fission=false;ninja=j:2'
          FINGERPRINT="$(printf '%s\n' "$UPSTREAM_TAG" "$CHROMIUM_REVISION" "$CPU_CONFIG_SHA" "$ENV_SHA" "$BUILD_ARGS" | sha256sum | awk '{print $1}')"

          ASSET_LIST="$STATE_DIR/assets.txt"
          : > "$ASSET_LIST"
          if gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$ASSET_LIST" 2>/dev/null; then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
          fi

          MAX_ASSET_CP="$(sed -nE 's/^state-c([0-9]{4})-(manifest\.txt|part-[0-9]{3})$/\1/p' "$ASSET_LIST" | sort | tail -n 1)"
          MAX_ASSET_CP="${MAX_ASSET_CP:-0000}"
          NEXT_NUM=$((10#$MAX_ASSET_CP + 1))
          printf -v NEXT_CP '%04d' "$NEXT_NUM"

          mapfile -t COMPLETE_IDS < <(sed -nE 's/^state-c([0-9]{4})-manifest\.txt$/\1/p' "$ASSET_LIST" | sort -u)
          LAST_CP=0000
          if [[ "$RELEASE_EXISTS" == true && ${#COMPLETE_IDS[@]} -gt 0 ]]; then
            # A full snapshot contains the complete output tree. Do not download
            # or apply deltas from before the newest full snapshot.
            MANIFEST_PROBE="$RUNNER_TEMP/brave-state-manifest-probe"
            mkdir -p "$MANIFEST_PROBE"
            BASE_CP=""
            for CP in "${COMPLETE_IDS[@]}"; do
              if gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "state-c${CP}-manifest.txt" --dir "$MANIFEST_PROBE"; then
                if grep -qx 'full_snapshot=true' "$MANIFEST_PROBE/state-c${CP}-manifest.txt"; then
                  BASE_CP="$CP"
                fi
              else
                echo "::warning::Could not inspect old checkpoint manifest $CP; it will not be restored."
              fi
            done
            if [[ -z "$BASE_CP" ]]; then
              echo "::error::No downloadable full-snapshot checkpoint exists; refusing to restore an incomplete chain."
              exit 1
            fi

            RESTORE_IDS=()
            for CP in "${COMPLETE_IDS[@]}"; do
              if [[ "$CP" < "$BASE_CP" ]]; then
                echo "Skipping superseded checkpoint $CP; full snapshot $BASE_CP replaces it."
              else
                RESTORE_IDS+=("$CP")
              fi
            done
            echo "Restoring from full snapshot $BASE_CP and subsequent deltas only."

            for CP in "${RESTORE_IDS[@]}"; do
              gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "state-c${CP}-manifest.txt" --dir "$STATE_DIR"
              MANIFEST="$STATE_DIR/state-c${CP}-manifest.txt"

              if ! grep -qx "fingerprint=$FINGERPRINT" "$MANIFEST"; then
                echo "::error::Checkpoint $CP is incompatible with current Brave/Chromium source or build configuration."
                echo "Expected fingerprint: $FINGERPRINT"
                grep -E '^(upstream_tag|chromium_revision|fingerprint|full_snapshot)=' "$MANIFEST" || true
                exit 1
              fi
              EXPECTED_PARTS="$(sed -n 's/^part_count=//p' "$MANIFEST")"
              ACTUAL_PARTS="$(grep -Ec "^state-c${CP}-part-[0-9]{3}$" "$ASSET_LIST" || true)"
              if [[ -z "$EXPECTED_PARTS" || "$EXPECTED_PARTS" != "$ACTUAL_PARTS" || "$EXPECTED_PARTS" == 0 ]]; then
                echo "::error::Checkpoint $CP is incomplete: expected $EXPECTED_PARTS parts, found $ACTUAL_PARTS."
                exit 1
              fi

              gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "state-c${CP}-part-*" --dir "$STATE_DIR"
              mapfile -t PARTS < <(find "$STATE_DIR" -maxdepth 1 -type f -name "state-c${CP}-part-*" -print | sort)
              if (( ${#PARTS[@]} != EXPECTED_PARTS )); then
                echo "::error::Downloaded part count does not match checkpoint $CP manifest."
                exit 1
              fi
              echo "Restoring checkpoint $CP (${#PARTS[@]} archive parts)."
              cat "${PARTS[@]}" | zstd -d -c | tar -xpf - -C "$OUT"
              rm -f "${PARTS[@]}" "$MANIFEST"
              LAST_CP="$CP"
            done
            rm -rf "$MANIFEST_PROBE"
          else
            echo "No completed checkpoint found; this run starts the first saved build segment."
          fi

          {
            echo "state_tag=$STATE_TAG"
            echo "last_checkpoint=$LAST_CP"
            echo "next_checkpoint=$NEXT_CP"
            echo "chromium_revision=$CHROMIUM_REVISION"
            echo "fingerprint=$FINGERPRINT"
          } >> "$GITHUB_OUTPUT"
          echo "Last restored checkpoint: $LAST_CP; next checkpoint slot: $NEXT_CP."
          df -h "$GITHUB_WORKSPACE"
      - name: Compile Brave Release and build Linux package
        if: inputs.compact_state != true
        id: compile
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
          LAST_CHECKPOINT: ${{ steps.state.outputs.last_checkpoint }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/brave"
          BUILD_LOG="$GITHUB_WORKSPACE/brave-build.log"
          OUT="$GITHUB_WORKSPACE/src/out/Release"
          mkdir -p "$OUT"

          # Stop after one compile segment; the next runner restores a complete output snapshot.
          echo "Checkpoint baseline: $LAST_CHECKPOINT"
          echo "Starting incremental build with no swap; checkpoint timeout is 220 minutes."
          timeout --signal=INT --kill-after=90s 220m pnpm run create_dist Release \
            --gn=symbol_level:0 \
            --gn=blink_symbol_level:0 \
            --gn=v8_symbol_level:0 \
            --gn=use_debug_fission:false \
            --ninja=j:2 >"$BUILD_LOG" 2>&1 &
          BUILD_PID=$!
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            sleep 60
            echo "Brave Release build is still running."
            date -u
            df -h "$GITHUB_WORKSPACE"
            free -h
            tail -n 4 "$BUILD_LOG" || true
          done
          set +e
          wait "$BUILD_PID"
          RC=$?
          set -e

          if (( RC == 124 )); then
            echo "Build segment reached its planned time boundary; outputs will be checkpointed."
            echo "checkpoint=true" >> "$GITHUB_OUTPUT"
            tail -n 20 "$BUILD_LOG" || true
            exit 0
          fi
          if (( RC != 0 )); then
            echo "::error::Brave source build failed with exit code $RC."
            grep -Ein -B 2 -A 5 'fatal error:|undefined reference|FAILED:|ninja: build stopped|error:|failed to|not found' "$BUILD_LOG" | tail -n 120 || true
            echo "::group::Last 100 build log lines"
            tail -n 100 "$BUILD_LOG" || true
            echo "::endgroup::"
            exit "$RC"
          fi

          echo "Brave source build completed."
          echo "checkpoint=false" >> "$GITHUB_OUTPUT"
          grep -E 'Done\. Made|Packaging|Creating|brave-browser_.*\.deb|ninja: Entering|BUILD SUCCESS' "$BUILD_LOG" | tail -n 60 || true
          test -d "$OUT"

      - name: Trim locales and symbols, version the Core 2 package
        if: inputs.compact_state != true && steps.compile.outputs.checkpoint != 'true'
        id: package
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE/brave-package-work"
          ROOT="$WORK/root"
          CONTROL="$WORK/control"
          RELEASE_DIR="$GITHUB_WORKSPACE/release-artifacts"
          mkdir -p "$WORK" "$RELEASE_DIR"

          SOURCE_DEB=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(dpkg-deb -f "$candidate" Package 2>/dev/null || true)" == "brave-browser" &&
                  "$(dpkg-deb -f "$candidate" Architecture 2>/dev/null || true)" == "amd64" ]]; then
              SOURCE_DEB="$candidate"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE/src/out/Release" -maxdepth 1 -type f -name '*.deb' -print0)
          if [[ -z "$SOURCE_DEB" ]]; then
            echo "::error::The source build did not produce an amd64 brave-browser .deb."
            find "$GITHUB_WORKSPACE/src/out/Release" -maxdepth 1 -type f -printf '%f %s bytes\n' || true
            exit 1
          fi

          BUILD_VERSION="$(dpkg-deb -f "$SOURCE_DEB" Version)"
          PACKAGE_VERSION="$BUILD_VERSION+core2.1~$(date -u +%Y%m%d%H%M%S)"
          if ! dpkg --compare-versions "$PACKAGE_VERSION" gt "$BUILD_VERSION"; then
            echo "::error::Core 2 package version does not sort after the Brave source version."
            exit 1
          fi

          mkdir -p "$ROOT"
          sudo dpkg-deb --extract "$SOURCE_DEB" "$ROOT"
          sudo dpkg-deb --control "$SOURCE_DEB" "$CONTROL"
          sudo mkdir -p "$ROOT/DEBIAN"
          sudo cp -a "$CONTROL/." "$ROOT/DEBIAN/"

          BROWSER_DIR="$ROOT/opt/brave.com/brave"
          LOCALE_DIR="$BROWSER_DIR/locales"
          if [[ ! -x "$BROWSER_DIR/brave" || ! -d "$LOCALE_DIR" || ! -s "$LOCALE_DIR/en-US.pak" ]]; then
            echo "::error::Unexpected Brave .deb layout; refusing to prune an unrecognized package."
            exit 1
          fi

          ORIGINAL_PACKAGE_BYTES="$(stat -c '%s' "$SOURCE_DEB")"
          ORIGINAL_INSTALLED_BYTES="$(find "$ROOT" -type f -printf '%s\n' | awk '{sum += $1} END {printf "%.0f", sum}')"
          LOCALE_FILES_REMOVED="$(find "$LOCALE_DIR" -maxdepth 1 -type f -name '*.pak' ! -name 'en-US.pak' -printf '.' | wc -c)"
          LOCALE_BYTES_REMOVED="$(find "$LOCALE_DIR" -maxdepth 1 -type f -name '*.pak' ! -name 'en-US.pak' -printf '%s\n' | awk '{sum += $1} END {printf "%.0f", sum}')"
          if (( LOCALE_FILES_REMOVED == 0 )); then
            echo "::error::No non-English locale packs found."
            exit 1
          fi
          sudo find "$LOCALE_DIR" -maxdepth 1 -type f -name '*.pak' ! -name 'en-US.pak' -delete
          echo "Removed $LOCALE_FILES_REMOVED non-English locale packs ($LOCALE_BYTES_REMOVED uncompressed bytes); retained en-US.pak."

          ELF_FILES_REDUCED=0
          ELF_BYTES_SAVED=0
          while IFS= read -r -d '' candidate; do
            case "$candidate" in
              */chrome-sandbox|*/brave_sandbox|*/chrome_sandbox) continue ;;
            esac
            if file -b "$candidate" | grep -q '^ELF '; then
              before="$(stat -c '%s' "$candidate")"
              if sudo strip --strip-unneeded "$candidate" 2>/dev/null; then
                after="$(stat -c '%s' "$candidate")"
                if (( before > after )); then
                  ELF_FILES_REDUCED=$((ELF_FILES_REDUCED + 1))
                  ELF_BYTES_SAVED=$((ELF_BYTES_SAVED + before - after))
                fi
              fi
            fi
          done < <(find "$BROWSER_DIR" -type f -print0)

          INSTALLED_KB="$(du -sk --exclude=DEBIAN "$ROOT" | awk '{print $1}')"
          if [[ "$(grep -c '^Version:' "$ROOT/DEBIAN/control" || true)" != "1" ||
                "$(grep -c '^Installed-Size:' "$ROOT/DEBIAN/control" || true)" != "1" ]]; then
            echo "::error::Unexpected Brave package control metadata."
            exit 1
          fi
          sudo sed -i -E \
            -e "s/^Version:.*/Version: $PACKAGE_VERSION/" \
            -e "s/^Installed-Size:.*/Installed-Size: $INSTALLED_KB/" \
            "$ROOT/DEBIAN/control"

          # Regenerate payload MD5 sums after removing locales and stripping ELF files.
          sudo bash -c 'cd "$1" && find . -type f ! -path "./DEBIAN/*" -printf "%P\0" | LC_ALL=C sort -z | xargs -0 -r md5sum' _ "$ROOT" > "$WORK/md5sums"
          sudo install -m 0644 "$WORK/md5sums" "$ROOT/DEBIAN/md5sums"

          FINAL_DEB="$RELEASE_DIR/brave-browser_$(printf '%s' "$PACKAGE_VERSION")_amd64.deb"
          sudo dpkg-deb --build --root-owner-group --uniform-compression -Zxz -z6 "$ROOT" "$FINAL_DEB"
          sudo chown "$USER":"$(id -gn)" "$FINAL_DEB"
          test "$(dpkg-deb -f "$FINAL_DEB" Package)" = "brave-browser"
          test "$(dpkg-deb -f "$FINAL_DEB" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$FINAL_DEB" Version)" = "$PACKAGE_VERSION"
          dpkg-deb --contents "$FINAL_DEB" > "$WORK/final-files.txt"
          awk '
            $NF ~ /\/locales\/[^/]+\.pak$/ {
              if ($NF == "./opt/brave.com/brave/locales/en-US.pak") english = 1
              else bad = 1
            }
            END { exit !(english == 1 && bad == 0) }
          ' "$WORK/final-files.txt" || {
            echo "::error::Final package does not contain exactly the retained en-US locale pack."
            exit 1
          }

          FINAL_PACKAGE_BYTES="$(stat -c '%s' "$FINAL_DEB")"
          FINAL_INSTALLED_BYTES="$(find "$ROOT" -type f -printf '%s\n' | awk '{sum += $1} END {printf "%.0f", sum}')"
          SAVED_INSTALLED_BYTES="$((ORIGINAL_INSTALLED_BYTES - FINAL_INSTALLED_BYTES))"
          SAFE_VERSION="$(printf '%s' "$PACKAGE_VERSION" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
          RELEASE_TAG="core2-brave-browser-$SAFE_VERSION"

          cat > "$RELEASE_DIR/BUILD-INFO.txt" <<EOF
          Package: brave-browser
          Build: Brave/Chromium source build; not an upstream .deb repack
          Brave source tag: $UPSTREAM_TAG
          Brave source version: $UPSTREAM_VERSION
          Built Debian package version: $BUILD_VERSION
          Core 2 package version: $PACKAGE_VERSION
          Chromium version: pinned by brave-core $UPSTREAM_TAG
          Architecture: amd64
          Compiler flags: -march=core2 -mtune=core2 in Chromium common x64 ABI flags
          Build configuration: Release, symbol_level=0, blink_symbol_level=0, v8_symbol_level=0
          Non-English locale .pak files removed: $LOCALE_FILES_REMOVED
          Uncompressed locale bytes removed: $LOCALE_BYTES_REMOVED
          ELF files reduced by strip --strip-unneeded: $ELF_FILES_REDUCED
          ELF bytes removed by stripping: $ELF_BYTES_SAVED
          Total installed payload bytes removed: $SAVED_INSTALLED_BYTES
          Source-build .deb bytes: $ORIGINAL_PACKAGE_BYTES
          Final trimmed .deb bytes: $FINAL_PACKAGE_BYTES
          API configuration: placeholder values; some server-integrated features may require valid credentials
          EOF

          cd "$RELEASE_DIR"
          sha256sum "$(basename "$FINAL_DEB")" BUILD-INFO.txt > SHA256SUMS-core2-brave-browser.txt
          {
            echo "package_version=$PACKAGE_VERSION"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Brave Core 2 source-build summary"
            echo
            echo "- Brave source: $UPSTREAM_TAG"
            echo "- Package version: $PACKAGE_VERSION"
            echo "- Removed non-English locale packs: $LOCALE_FILES_REMOVED ($LOCALE_BYTES_REMOVED bytes)"
            echo "- Stripped ELF files: $ELF_FILES_REDUCED ($ELF_BYTES_SAVED bytes saved)"
            echo "- Installed payload bytes removed: $SAVED_INSTALLED_BYTES"
            echo "- Compressed .deb: $ORIGINAL_PACKAGE_BYTES → $FINAL_PACKAGE_BYTES bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$FINAL_DEB" BUILD-INFO.txt SHA256SUMS-core2-brave-browser.txt

      - name: Upload build logs and package artifacts
        if: always() && inputs.compact_state != true
        uses: actions/upload-artifact@v4
        with:
          name: brave-core2-source-build-${{ github.run_id }}
          path: |
            pnpm-install.log
            brave-sync.log
            build-deps.log
            brave-build.log
            release-artifacts/*
          if-no-files-found: warn
          retention-days: 7

      - name: Save and upload incremental build checkpoint
        id: save_state
        if: success() && (inputs.compact_state == true || steps.compile.outputs.checkpoint == 'true')
        shell: bash
        env:
          COMPACT_STATE: ${{ inputs.compact_state }}
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
          STATE_TAG: ${{ steps.state.outputs.state_tag }}
          LAST_CHECKPOINT: ${{ steps.state.outputs.last_checkpoint }}
          NEXT_CHECKPOINT: ${{ steps.state.outputs.next_checkpoint }}
          CHROMIUM_REVISION: ${{ steps.state.outputs.chromium_revision }}
          FINGERPRINT: ${{ steps.state.outputs.fingerprint }}
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE"
          OUT="$WORK/src/out/Release"
          PART_DIR="$RUNNER_TEMP/brave-state-parts"
          FILE_LIST="$RUNNER_TEMP/brave-state-files.list"
          mkdir -p "$PART_DIR"
          rm -f "$PART_DIR"/state-c${NEXT_CHECKPOINT}-part-*
          : > "$FILE_LIST"

          # Siso's dependency and filesystem-state files must match the complete set
          # of restored objects. Timestamp-only deltas can omit state files, causing
          # the next runner to schedule already-compiled objects again. Save a full,
          # self-contained output snapshot at every boundary instead.
          echo "Capturing full output snapshot $NEXT_CHECKPOINT (previous checkpoint $LAST_CHECKPOINT)."
          (cd "$OUT" && find . \( -type f -o -type l \) -print0) > "$FILE_LIST"

          FILE_COUNT="$(tr -cd '\000' < "$FILE_LIST" | wc -c)"
          if (( FILE_COUNT == 0 )); then
            echo "::error::No build outputs changed during the timed segment; refusing to publish an empty checkpoint."
            exit 1
          fi
          echo "Files in checkpoint snapshot: $FILE_COUNT"
          echo "=== Space before checkpoint compression ==="
          df -h "$GITHUB_WORKSPACE"

          PREFIX="$PART_DIR/state-c${NEXT_CHECKPOINT}-part-"
          set -o pipefail
          tar --create --file=- --directory="$OUT" --no-recursion --null --files-from="$FILE_LIST" \
            | zstd -T0 -3 -c \
            | split -b 1700M -d -a 3 - "$PREFIX"

          mapfile -t PARTS < <(find "$PART_DIR" -maxdepth 1 -type f -name "state-c${NEXT_CHECKPOINT}-part-*" -print | sort)
          if (( ${#PARTS[@]} == 0 )); then
            echo "::error::Checkpoint archive did not produce any parts."
            exit 1
          fi

          # Validate the compressed stream and tar archive before replacing prior state.
          cat "${PARTS[@]}" | zstd -t
          ARCHIVE_FILE_COUNT="$(cat "${PARTS[@]}" | zstd -d -c | tar -tf - | wc -l)"
          if [[ "$ARCHIVE_FILE_COUNT" != "$FILE_COUNT" ]]; then
            echo "::error::Snapshot archive contains $ARCHIVE_FILE_COUNT entries; expected $FILE_COUNT."
            exit 1
          fi
          echo "Validated full snapshot archive: $ARCHIVE_FILE_COUNT entries."

          if ! gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STATE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Temporary Brave/Chromium build state $UPSTREAM_TAG" \
              --notes "Temporary incremental build checkpoints for the Core 2 Brave source build. Assets are split into files smaller than GitHub's per-asset limit. This release is build state, not a browser package." \
              --prerelease
          fi

          for PART in "${PARTS[@]}"; do
            echo "Uploading $(basename "$PART") ($(stat -c '%s' "$PART") bytes)"
            gh release upload "$STATE_TAG" "$PART" --repo "$GITHUB_REPOSITORY"
          done

          MANIFEST="$PART_DIR/state-c${NEXT_CHECKPOINT}-manifest.txt"
          cat > "$MANIFEST" <<EOF
          format=1
          checkpoint=$NEXT_CHECKPOINT
          upstream_tag=$UPSTREAM_TAG
          chromium_revision=$CHROMIUM_REVISION
          fingerprint=$FINGERPRINT
          file_count=$FILE_COUNT
          part_count=${#PARTS[@]}
          full_snapshot=true
          covers_through=$NEXT_CHECKPOINT
          created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          # The manifest is uploaded last; its presence means all parts were uploaded.
          gh release upload "$STATE_TAG" "$MANIFEST" --repo "$GITHUB_REPOSITORY"

          # Verify the remote manifest and every part before any checkpoint cleanup.
          REMOTE_ASSETS="$RUNNER_TEMP/brave-state-remote-assets.txt"
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$REMOTE_ASSETS"
          grep -qx "state-c${NEXT_CHECKPOINT}-manifest.txt" "$REMOTE_ASSETS"
          REMOTE_PARTS="$(grep -Ec "^state-c${NEXT_CHECKPOINT}-part-[0-9]{3}$" "$REMOTE_ASSETS" || true)"
          if [[ "$REMOTE_PARTS" != "${#PARTS[@]}" ]]; then
            echo "::error::Remote snapshot verification failed; preserving all prior checkpoints."
            exit 1
          fi
          VERIFY_DIR="$RUNNER_TEMP/brave-state-verify"
          mkdir -p "$VERIFY_DIR"
          gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "state-c${NEXT_CHECKPOINT}-manifest.txt" --dir "$VERIFY_DIR"
          grep -qx "full_snapshot=true" "$VERIFY_DIR/state-c${NEXT_CHECKPOINT}-manifest.txt"
          grep -qx "file_count=$FILE_COUNT" "$VERIFY_DIR/state-c${NEXT_CHECKPOINT}-manifest.txt"
          echo "Remote full snapshot $NEXT_CHECKPOINT verified: $FILE_COUNT files, $REMOTE_PARTS part(s)."
          echo "part_count=${#PARTS[@]}" >> "$GITHUB_OUTPUT"
          echo "full_snapshot=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Brave build checkpoint saved"
            echo
            echo "- Source: $UPSTREAM_TAG"
            echo "- Chromium revision: $CHROMIUM_REVISION"
            echo "- Completed checkpoint: $NEXT_CHECKPOINT"
            echo "- Changed files stored: $FILE_COUNT"
            echo "- Compressed parts: ${#PARTS[@]}"
            echo "- State release: $STATE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune obsolete checkpoints after verified full snapshot
        if: success() && steps.save_state.outcome == 'success' && steps.save_state.outputs.full_snapshot == 'true'
        shell: bash
        env:
          STATE_TAG: ${{ steps.state.outputs.state_tag }}
          PRESERVE_CHECKPOINT: ${{ steps.state.outputs.next_checkpoint }}
          EXPECTED_PARTS: ${{ steps.save_state.outputs.part_count }}
        run: |
          set -euo pipefail
          PART_DIR="$RUNNER_TEMP/brave-state-parts"
          MANIFEST="$PART_DIR/state-c${PRESERVE_CHECKPOINT}-manifest.txt"
          grep -qx 'full_snapshot=true' "$MANIFEST" || {
            echo "::error::The new checkpoint is not a full snapshot; preserving all previous checkpoints."
            exit 1
          }

          ASSETS="$RUNNER_TEMP/brave-state-cleanup-assets.tsv"
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.id, .name] | @tsv' > "$ASSETS"
          awk -F '\t' -v cp="$PRESERVE_CHECKPOINT" '$2 == "state-c" cp "-manifest.txt" {found=1} END {exit !found}' "$ASSETS" || {
            echo "::error::Remote snapshot manifest is missing; preserving all previous checkpoints."
            exit 1
          }
          ACTUAL_PARTS="$(awk -F '\t' -v cp="$PRESERVE_CHECKPOINT" '$2 ~ ("^state-c" cp "-part-[0-9][0-9][0-9]$") {n++} END {print n+0}' "$ASSETS")"
          if [[ "$ACTUAL_PARTS" != "$EXPECTED_PARTS" || "$EXPECTED_PARTS" == "0" ]]; then
            echo "::error::Remote snapshot parts are incomplete; preserving all previous checkpoints."
            exit 1
          fi

          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            if [[ "$ASSET_NAME" =~ ^state-c([0-9]{4})-(manifest\.txt|part-[0-9]{3})$ ]]; then
              CP="${BASH_REMATCH[1]}"
              if [[ "$CP" != "$PRESERVE_CHECKPOINT" ]]; then
                echo "Deleting superseded checkpoint asset $ASSET_NAME (ID $ASSET_ID)"
                if gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" >/dev/null; then
                  echo "Deleted $ASSET_NAME."
                else
                  echo "::warning::GitHub refused to delete $ASSET_NAME (ID $ASSET_ID); this is non-fatal because checkpoint $PRESERVE_CHECKPOINT is a verified full snapshot."
                fi
              fi
            fi
          done < "$ASSETS"
          REMAINING_OLD="$(gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | awk -v keep="$PRESERVE_CHECKPOINT" '$0 ~ /^state-c[0-9][0-9][0-9][0-9]-(manifest\.txt|part-[0-9][0-9][0-9])$/ { cp = substr($0, 8, 4); if (cp < keep) n++ } END { print n+0 }')" 
          if [[ "$REMAINING_OLD" != "0" ]]; then
            echo "::warning::$REMAINING_OLD superseded checkpoint assets remain in the release; restore will ignore those before full snapshot $PRESERVE_CHECKPOINT."
          else
            echo "Retained full snapshot checkpoint $PRESERVE_CHECKPOINT; all superseded checkpoints removed."
          fi

      - name: Queue the next Brave compilation session
        if: success() && steps.save_state.outcome == 'success' && (inputs.compact_state == true || steps.compile.outputs.checkpoint == 'true')
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
        run: |
          set -euo pipefail
          echo "Checkpoint is durable; queueing the next Brave compilation session for $UPSTREAM_VERSION."
          gh workflow run d630-core2-brave-source.yml \
            --repo "$GITHUB_REPOSITORY" --ref master \
            -f version="$UPSTREAM_VERSION"

      - name: Publish source-built Brave package release
        if: inputs.compact_state != true && success() && steps.compile.outputs.checkpoint != 'true'
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/release-artifacts"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          cat > release-notes.md <<EOF
          ## Core 2 source-built Brave Browser

          Brave was compiled from source tag $UPSTREAM_TAG (version $UPSTREAM_VERSION)
          for the Intel Core 2 target, then packaged and trimmed for an English-language
          desktop install.

          - Chromium is pinned by Brave's own source manifest for $UPSTREAM_TAG.
          - Added -march=core2 -mtune=core2 to Chromium's common x64 compiler ABI flags.
          - Built the Release configuration with symbol levels set to zero.
          - Removed non-English locale .pak files, retaining en-US.pak.
          - Applied strip --strip-unneeded to eligible ELF files, excluding sandbox binaries.
          - Updated Debian package metadata and regenerated payload MD5 sums.
          - Placeholder API values are used because private service credentials are not bundled; features requiring real credentials may be unavailable.
          - SHA-256 checksums cover the package and build metadata.
          EOF
          gh release create "$RELEASE_TAG" ./*.deb BUILD-INFO.txt SHA256SUMS-core2-brave-browser.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Core 2 source-built brave-browser $PACKAGE_VERSION" \
            --notes-file release-notes.md

          if gh workflow run d630-core2-update-release-index.yml --repo "$GITHUB_REPOSITORY" --ref master; then
            echo "Dispatched package index refresh."
          else
            echo "::warning::Package release created, but release-index refresh could not be dispatched."
          fi

      - name: Remove temporary build-state release after final package publication
        if: inputs.compact_state != true && success() && steps.compile.outputs.checkpoint != 'true'
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
        run: |
          set -euo pipefail
          STATE_TAG="core2-brave-state-v${UPSTREAM_VERSION}"
          if gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "Removed temporary build-state release $STATE_TAG after publishing the final package."
          else
            echo "No temporary build-state release to remove."
          fi
