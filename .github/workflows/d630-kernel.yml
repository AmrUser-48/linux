name: Dell Latitude D630 — Linux 7.2.9 stable

on:
  push:
    branches:
      - d630-stable-7.2.9
  workflow_dispatch:

concurrency:
  group: d630-kernel-7.2.9
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build stripped D630 Debian packages (Linux 7.2.9)
    runs-on: ubuntu-22.04
    container:
      image: debian:12

    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ARCH: x86_64
      KCFLAGS: -O2 -pipe -march=core2 -mtune=core2
      KCPPFLAGS: -march=core2 -mtune=core2

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git make gcc g++ build-essential debhelper lsb-release bc bison flex \
            libssl-dev libelf-dev libdw-dev dwarves \
            cpio kmod fakeroot dpkg-dev rsync perl xz-utils zstd \
            python3 file

      - name: Checkout Linux 7.2.9 source and D630 config
        uses: actions/checkout@v5

      - name: Prepare stripped Debian-compatible D630 configuration
        shell: bash
        run: |
          set -euxo pipefail
          test "$(make -s kernelversion)" = "7.2.9"

          make x86_64_defconfig
          scripts/kconfig/merge_config.sh -m .config arch/x86/configs/d630.config
          make olddefconfig
          bash arch/x86/configs/d630-prune-modules.sh

          config_state() {
            local value
            value="$(./scripts/config --state "$1" 2>/dev/null || true)"
            case "$value" in
              y|m|n) printf '%s' "$value" ;;
              undef|'') printf 'n' ;;
              *) echo "Unexpected state for $1: $value" >&2; return 1 ;;
            esac
          }

          echo "=== D630 hardware requirements ==="
          for opt in \
            X86_MSR CPU_SUP_INTEL DRM_I915 DRM_SIMPLEDRM FB_VESA AGP_INTEL \
            ACPI ACPI_BATTERY X86_ACPI_CPUFREQ CPU_IDLE SENSORS_CORETEMP \
            SND_HDA_INTEL SND_HDA_CODEC_SIGMATEL SATA_AHCI ATA_PIIX \
            USB_EHCI_HCD USB_OHCI_HCD USB_UHCI_HCD IWL3945 \
            FAT_FS MSDOS_FS VFAT_FS ISO9660_FS UDF_FS EXT4_FS BTRFS_FS NTFS3_FS \
            FW_LOADER ZRAM ZSMALLOC; do
            printf 'CONFIG_%s=' "$opt"
            config_state "CONFIG_$opt"
          done

          echo "=== Debian userspace compatibility ==="
          for opt in \
            AUDIT AUDITSYSCALL CGROUPS CGROUP_PIDS CGROUP_DEVICE CGROUP_BPF \
            NAMESPACES UTS_NS TIME_NS IPC_NS USER_NS PID_NS NET_NS \
            BPF BPF_SYSCALL BPF_JIT SECCOMP SECCOMP_FILTER \
            SECURITY SECURITYFS SECURITY_APPARMOR SECURITY_LANDLOCK SECURITY_YAMA \
            INOTIFY_USER FANOTIFY FHANDLE IO_URING; do
            printf 'CONFIG_%s=' "$opt"
            config_state "CONFIG_$opt"
          done

          test "$(config_state CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL)" = "y"
          test "$(config_state CONFIG_CPU_FREQ_GOV_SCHEDUTIL)" = "y"
          test "$(config_state CONFIG_MODULES)" = "y"
          test "$(config_state CONFIG_MODULE_UNLOAD)" = "y"
          test "$(config_state CONFIG_MODULE_FORCE_UNLOAD)" = "n"
          test "$(config_state CONFIG_MODVERSIONS)" = "y"
          test "$(config_state CONFIG_MODULE_SIG)" = "y"
          test "$(config_state CONFIG_CGROUPS)" = "y"
          test "$(config_state CONFIG_NAMESPACES)" = "y"
          test "$(config_state CONFIG_USER_NS)" = "y"
          test "$(config_state CONFIG_NET_NS)" = "y"
          test "$(config_state CONFIG_BPF_SYSCALL)" = "y"
          test "$(config_state CONFIG_SECCOMP_FILTER)" = "y"
          test "$(config_state CONFIG_SECURITY_APPARMOR)" = "y"
          test "$(config_state CONFIG_SECURITY_LANDLOCK)" = "y"

          test "$(config_state CONFIG_NETFILTER)" = "y"
          test "$(config_state CONFIG_NETFILTER_XTABLES_LEGACY)" = "y"
          test "$(config_state CONFIG_IP_NF_IPTABLES_LEGACY)" = "m"
          test "$(config_state CONFIG_IP6_NF_IPTABLES_LEGACY)" = "m"
          test "$(config_state CONFIG_NF_CONNTRACK)" = "m"
          test "$(config_state CONFIG_NF_TABLES)" = "m"
          test "$(config_state CONFIG_NF_NAT)" = "m"
          test "$(config_state CONFIG_NFT_CT)" = "m"
          test "$(config_state CONFIG_NFT_MASQ)" = "m"
          test "$(config_state CONFIG_IP_NF_NAT)" = "m"
          test "$(config_state CONFIG_IP6_NF_NAT)" = "m"
          test "$(config_state CONFIG_FUSE_FS)" = "m"
          test "$(config_state CONFIG_OVERLAY_FS)" = "m"

          test "$(config_state CONFIG_EFI)" = "n"
          test "$(config_state CONFIG_EFI_STUB)" = "n"
          test "$(config_state CONFIG_KERNEL_XZ)" = "y"
          test "$(config_state CONFIG_KERNEL_GZIP)" = "n"
          test "$(config_state CONFIG_BLK_DEV_INITRD)" = "y"
          test "$(config_state CONFIG_DEVTMPFS)" = "y"
          test "$(config_state CONFIG_DEVTMPFS_MOUNT)" = "y"
          test "$(config_state CONFIG_MICROCODE)" = "y"

          test "$(config_state CONFIG_VIRTUALIZATION)" = "y"
          test "$(config_state CONFIG_KVM)" = "m"
          test "$(config_state CONFIG_KVM_INTEL)" = "m"
          test "$(config_state CONFIG_KVM_AMD)" = "n"
          test "$(config_state CONFIG_TUN)" = "m"
          test "$(config_state CONFIG_INPUT_JOYSTICK)" = "y"
          test "$(config_state CONFIG_INPUT_JOYDEV)" = "m"
          test "$(config_state CONFIG_HIDRAW)" = "y"
          test "$(config_state CONFIG_INPUT_UINPUT)" = "m"
          test "$(config_state CONFIG_BINFMT_MISC)" = "m"

          test "$(config_state CONFIG_ZRAM)" = "y"
          test "$(config_state CONFIG_ZRAM_BACKEND_LZ4)" = "y"
          test "$(config_state CONFIG_ZRAM_DEF_COMP_LZ4)" = "y"
          test "$(config_state CONFIG_ZRAM_BACKEND_LZ4HC)" = "n"
          test "$(config_state CONFIG_ZRAM_BACKEND_ZSTD)" = "n"
          test "$(config_state CONFIG_ZRAM_BACKEND_DEFLATE)" = "n"
          test "$(config_state CONFIG_ZRAM_BACKEND_842)" = "n"
          test "$(config_state CONFIG_BTRFS_FS)" = "y"
          test "$(config_state CONFIG_NTFS3_FS)" = "y"
          test "$(config_state CONFIG_EXT4_FS)" = "y"
          test "$(config_state CONFIG_FW_LOADER)" = "y"

          echo "=== Remaining loadable modules ==="
          grep '=m$' .config || true

      - name: Build minimal Intel 3945 firmware package
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/d630-firmware-package.sh ..

      - name: Build Linux 7.2.9 Debian kernel packages
        shell: bash
        run: |
          set -euxo pipefail
          export LOCALVERSION=-d630-core2
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export KBUILD_BUILD_USER=AmrUser-48
          export KBUILD_BUILD_HOST=github-actions
          export KDEB_CHANGELOG_DIST=bookworm
          export KBUILD_BUILD_TIMESTAMP="$(git log -1 --format=%cI)"

          make -j2 bindeb-pkg LOCALVERSION="${LOCALVERSION}" INSTALL_MOD_STRIP=1

      - name: Validate packages and size
        shell: bash
        run: |
          set -euxo pipefail
          test -f arch/x86/boot/bzImage
          file arch/x86/boot/bzImage
          echo "=== Debian packages ==="
          ls -lh ../linux-image-*.deb ../d630-firmware-iwl3945_*.deb
          dpkg-deb -f ../linux-image-*.deb Package Version Architecture
          dpkg-deb -c ../linux-image-*.deb | awk '{print $5, $6}' | sort -nr | head -30
          echo "=== Packaged module count ==="
          dpkg-deb -c ../linux-image-*.deb | grep -E '/lib/modules/.+\.ko' | wc -l

      - name: Create checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd ..
          sha256sum linux-image-*.deb d630-firmware-iwl3945_*.deb > SHA256SUMS-d630-7.2.9.txt

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf release-artifacts
          mkdir -p release-artifacts
          cp ../linux-image-*.deb release-artifacts/
          cp ../d630-firmware-iwl3945_*.deb release-artifacts/
          cp ../SHA256SUMS-d630-7.2.9.txt release-artifacts/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-d630-core2-7.2.9-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish D630 Linux 7.2.9 release
    needs: build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: d630-7.2.9-${{ github.sha }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-d630-core2-7.2.9-${{ github.sha }}
          path: dist

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euxo pipefail
          cd dist
          cat > release-notes.md <<EOF
          ## Dell Latitude D630 / Core 2 Duo — Linux 7.2.9

          Built from the Linux 7.2.9 source commit ${{ github.sha }} in Debian 12.

          - D630 GMA X3100 graphics, ACPI, audio, storage and Intel 3945ABG
          - separate Intel 3945 firmware Debian package
          - ext4, Btrfs, NTFS3 and common removable-media filesystems built in
          - LZ4 zram and schedutil default CPU governor
          - Debian-oriented cgroups/namespaces, seccomp/eBPF and AppArmor/Landlock
          - selected nftables/iptables, FUSE and OverlayFS modules
          - unused hardware-driver module families pruned

          Install the kernel image and d630-firmware-iwl3945 packages. Keep
          Debian intel-microcode installed and retain a known-good kernel as fallback.
          EOF

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" linux-image-*.deb d630-firmware-iwl3945_*.deb \
              SHA256SUMS-d630-7.2.9.txt --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" linux-image-*.deb d630-firmware-iwl3945_*.deb \
              SHA256SUMS-d630-7.2.9.txt --repo "${GITHUB_REPOSITORY}" \
              --title "Dell Latitude D630 Linux 7.2.9 (${{ github.sha }})" \
              --notes-file release-notes.md --target "${GITHUB_SHA}"
          fi
