name: Core 2 GCC frozen build
run-name: "Core 2 GCC frozen build / #${{ github.run_number }}"

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/d630-core2-gcc-frozen-build.yml"
      - "scripts/core2/frozen-gcc-build.sh"
  workflow_dispatch:
    inputs:
      reset_checkpoint:
        description: Ignore saved GCC build state and start a clean build
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: core2-gcc-frozen-build
  cancel-in-progress: false

jobs:
  build:
    name: Restore clean workspace, build GCC 12 from scratch, and publish packages
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      published: ${{ steps.gcc_build.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      RESET_CHECKPOINT: ${{ inputs.reset_checkpoint }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Validate shell syntax before allocating build resources
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/core2/frozen-gcc-build.sh
          command -v docker
          command -v gh
          command -v zstd
          command -v jq

      - name: Show available build resources
        shell: bash
        run: |
          set -euo pipefail
          printf 'CPU threads: '; nproc
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Restore prepared workspace, clean, and build GCC 12 from scratch
        id: gcc_build
        shell: bash
        run: bash scripts/core2/frozen-gcc-build.sh

  defaults:
    name: Build default gcc/cpp packages after GCC runtime publication
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.published == 'true'
    uses: ./.github/workflows/d630-core2-system-package.yml
    with:
      package: gcc-defaults
      force_rebuild: true
      refresh_index: true
