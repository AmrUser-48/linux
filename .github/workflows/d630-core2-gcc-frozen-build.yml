name: Core 2 GCC frozen build
run-name: "Core 2 GCC frozen build / #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      reset_checkpoint:
        description: Ignore saved GCC build state and start a clean build
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: core2-gcc-frozen-build
  cancel-in-progress: false

jobs:
  build:
    name: Restore checkpoint, compile GCC 12, and publish packages
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RESET_CHECKPOINT: ${{ inputs.reset_checkpoint }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Validate shell syntax before allocating build resources
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/core2/frozen-gcc-build.sh
          command -v docker
          command -v gh
          command -v zstd
          command -v jq

      - name: Show available build resources
        shell: bash
        run: |
          set -euo pipefail
          printf 'CPU threads: '; nproc
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Restore build tree and build GCC 12
        shell: bash
        run: bash scripts/core2/frozen-gcc-build.sh
