name: Core 2 libjpeg-turbo restored-flags test
run-name: "Core 2 libjpeg-turbo restored-flags test"

on:
  push:
    paths:
      - ".github/workflows/d630-core2-libjpeg-turbo-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core2-libjpeg-turbo-restored-flags-test
  cancel-in-progress: false

jobs:
  build:
    name: Build libjpeg-turbo restored-flags candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: debian:12
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PACKAGE: libjpeg-turbo
      BUILD_JOBS: "4"
      DEB_BUILD_OPTIONS: "parallel=4 noautodbgsym"
      DEB_CFLAGS_MAINT_APPEND: "-O3 -march=core2 -mtune=core2 -ffast-math -funroll-loops"
      DEB_CXXFLAGS_MAINT_APPEND: "-O3 -march=core2 -mtune=core2 -ffast-math -funroll-loops"
      DEB_FFLAGS_MAINT_APPEND: "-O3 -march=core2 -mtune=core2 -ffast-math -funroll-loops"

    steps:
      - name: Install Debian packaging tools and enable Bookworm source repositories
        shell: bash
        run: |
          set -euxo pipefail
          cat > /etc/apt/sources.list.d/core2-test.list <<'SOURCES'
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb-src http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          deb-src http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          deb-src http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          SOURCES
          rm -f /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dpkg-dev fakeroot \
            ca-certificates curl file xz-utils zstd jq cmake ninja-build \
            python3 pkg-config quilt nasm

      - name: Verify effective restored-flags profile
        shell: bash
        run: |
          set -euxo pipefail
          CFLAGS="$(dpkg-buildflags --get CFLAGS)"
          CXXFLAGS="$(dpkg-buildflags --get CXXFLAGS)"
          FFLAGS="$(dpkg-buildflags --get FFLAGS)"
          printf 'CFLAGS=%s\nCXXFLAGS=%s\nFFLAGS=%s\n' "$CFLAGS" "$CXXFLAGS" "$FFLAGS" \
            | tee "$GITHUB_WORKSPACE/core2-restored-build-flags.txt"
          for flags in "$CFLAGS" "$CXXFLAGS" "$FFLAGS"; do
            grep -q -- '-O3' <<<"$flags"
            grep -q -- '-march=core2' <<<"$flags"
            grep -q -- '-mtune=core2' <<<"$flags"
            grep -q -- '-ffast-math' <<<"$flags"
            grep -q -- '-funroll-loops' <<<"$flags"
            if grep -q -- '-flto' <<<"$flags"; then
              echo "::error::LTO must not be enabled in this test."
              exit 1
            fi
          done
          echo "Confirmed profile: -O3 -march=core2 -mtune=core2 -ffast-math -funroll-loops; no LTO."

      - name: Download the existing Core 2 baseline packages
        shell: bash
        run: |
          set -euxo pipefail
          BASELINE_TAG="core2-libjpeg-turbo-1-2.1.5-2-core2.1-20261011153748"
          BASELINE_DIR="$GITHUB_WORKSPACE/release-artifacts/baseline"
          mkdir -p "$BASELINE_DIR" "$GITHUB_WORKSPACE/release-artifacts/restored"

          curl -fsSL \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$BASELINE_TAG" \
            -o "$RUNNER_TEMP/baseline-release.json"

          jq -e '
            [.assets[]
              | select(.name | test("^(libjpeg-turbo-progs|libjpeg62-turbo|libturbojpeg0)_.*_amd64\\.deb$"))]
            | length == 3
          ' "$RUNNER_TEMP/baseline-release.json"

          jq -r '
            .assets[]
            | select(.name | test("^(libjpeg-turbo-progs|libjpeg62-turbo|libturbojpeg0)_.*_amd64\\.deb$"))
            | [.name, .browser_download_url] | @tsv
          ' "$RUNNER_TEMP/baseline-release.json" |
          while IFS=$'\t' read -r name url; do
            curl -fLsS "$url" -o "$BASELINE_DIR/$name"
            dpkg-deb -f "$BASELINE_DIR/$name" Package Version Architecture
          done

          test "$(find "$BASELINE_DIR" -maxdepth 1 -name '*.deb' | wc -l)" -eq 3
          {
            echo "Baseline release: $BASELINE_TAG"
            echo "Baseline profile: -O3 -pipe -march=core2 -mtune=core2"
            echo "The restored candidate adds -ffast-math -funroll-loops; LTO is disabled."
          } > "$GITHUB_WORKSPACE/release-artifacts/BASELINE-INFO.txt"

      - name: Fetch official Debian source and build dependencies
        id: source
        shell: bash
        run: |
          set -euxo pipefail
          apt-get build-dep -y "$PACKAGE"
          SRCROOT="$GITHUB_WORKSPACE/source-tree"
          mkdir -p "$SRCROOT"
          cd "$SRCROOT"
          apt-get source "$PACKAGE"
          SOURCE_DIR="$(find "$SRCROOT" -mindepth 1 -maxdepth 1 -type d -name "${PACKAGE}-*" -print -quit)"
          if [[ -z "$SOURCE_DIR" || ! -f "$SOURCE_DIR/debian/changelog" ]]; then
            echo "::error::Could not find unpacked Debian source for $PACKAGE."
            exit 1
          fi
          ORIGINAL_VERSION="$(dpkg-parsechangelog -l "$SOURCE_DIR/debian/changelog" -S Version)"
          NEW_VERSION="${ORIGINAL_VERSION}+core2test1~restored.${GITHUB_RUN_ID}"
          cd "$SOURCE_DIR"
          dch --newversion "$NEW_VERSION" --distribution bookworm --force-distribution \
            "Core 2 restored-flags performance test build; no LTO."
          test "$(dpkg-parsechangelog -S Version)" = "$NEW_VERSION"
          printf 'package=%s\nsource_version=%s\ntest_version=%s\nsource_dir=%s\n' \
            "$PACKAGE" "$ORIGINAL_VERSION" "$NEW_VERSION" "$SOURCE_DIR" \
            >> "$GITHUB_OUTPUT"

      - name: Compile Debian packages as an unprivileged user
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          PACKAGE_VERSION: ${{ steps.source.outputs.test_version }}
          SOURCE_VERSION: ${{ steps.source.outputs.source_version }}
        run: |
          set -euxo pipefail
          BUILD_USER=core2build
          id "$BUILD_USER" >/dev/null 2>&1 || useradd --create-home --shell /bin/bash "$BUILD_USER"
          chown -R "$BUILD_USER:$BUILD_USER" "$GITHUB_WORKSPACE/source-tree"
          cd "$SOURCE_DIR"
          runuser --preserve-environment --user "$BUILD_USER" -- env \
            HOME="/home/$BUILD_USER" USER="$BUILD_USER" LOGNAME="$BUILD_USER" \
            dpkg-buildpackage -rfakeroot -us -uc -b -j"$BUILD_JOBS"

          ARTIFACT_DIR="$GITHUB_WORKSPACE/release-artifacts/restored"
          shopt -s nullglob
          DEBS=("$GITHUB_WORKSPACE"/source-tree/*.deb)
          if (( ${#DEBS[@]} == 0 )); then
            echo "::error::Build produced no .deb files for $PACKAGE."
            exit 1
          fi
          INCLUDED=0
          for deb in "${DEBS[@]}"; do
            binary_package="$(dpkg-deb -f "$deb" Package)"
            binary_version="$(dpkg-deb -f "$deb" Version)"
            binary_arch="$(dpkg-deb -f "$deb" Architecture)"
            case "$binary_package" in
              *-dev|*-dbg|*-dbgsym|*-doc|*-doc-base)
                echo "Excluding development/debug/documentation package: $binary_package"
                continue
                ;;
            esac
            test "$binary_version" = "$PACKAGE_VERSION"
            case "$binary_arch" in amd64|all) ;; *) echo "::error::Unexpected architecture $binary_arch"; exit 1 ;; esac
            cp "$deb" "$ARTIFACT_DIR/"
            printf '%s %s %s %s\n' "$(basename "$deb")" "$binary_package" "$binary_version" "$binary_arch"
            INCLUDED=$((INCLUDED + 1))
          done
          test "$INCLUDED" -gt 0
          {
            printf '%s\n' \
              "Purpose: isolated benchmark artifact; not a production release" \
              "Source package: $PACKAGE" \
              "Debian Bookworm source version: $SOURCE_VERSION" \
              "Test package version: $PACKAGE_VERSION" \
              "Target: amd64 / Intel Core 2" \
              "Flags: -O3 -march=core2 -mtune=core2 -ffast-math -funroll-loops" \
              "LTO: disabled" \
              "Debian hardening flags: retained"
            printf '\nEffective dpkg-buildflags output:\n'
            cat "$GITHUB_WORKSPACE/core2-restored-build-flags.txt"
            printf '\nIncluded packages:\n'
            for deb in "$ARTIFACT_DIR"/*.deb; do
              printf '%s %s\n' "$(dpkg-deb -f "$deb" Package)" "$(basename "$deb")"
            done
          } > "$GITHUB_WORKSPACE/release-artifacts/RESTORED-INFO.txt"

      - name: Create reproducible benchmark runner and instructions
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/release-artifacts"

          cat > "$OUT/generate-ppm.py" <<'PYTHON'
          #!/usr/bin/env python3
          import random
          import sys

          path = sys.argv[1] if len(sys.argv) > 1 else "benchmark.ppm"
          width, height = 2048, 1536
          rng = random.Random(0xD630)
          with open(path, "wb") as image:
              image.write(f"P6\n{width} {height}\n255\n".encode("ascii"))
              for y in range(height):
                  row = bytearray(rng.randbytes(width * 3))
                  for x in range(width):
                      i = x * 3
                      row[i] = (row[i] * 3 + (x // 8 + y // 3) % 256) // 4
                      row[i + 1] = (row[i + 1] * 3 + (x // 5 + y // 7 + 80) % 256) // 4
                      row[i + 2] = (row[i + 2] * 3 + (x // 11 + y // 4 + 160) % 256) // 4
                  image.write(row)
          print(f"Created {path}: {width}x{height} RGB PPM")
          PYTHON

          cat > "$OUT/benchmark.sh" <<'BENCH_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          WORK="$(mktemp -d "${TMPDIR:-/tmp}/core2-jpeg-bench.XXXXXX")"
          trap 'rm -rf "$WORK"' EXIT

          for variant in baseline restored; do
            mkdir -p "$WORK/$variant"
            shopt -s nullglob
            debs=("$ROOT/$variant"/*.deb)
            if (( ${#debs[@]} == 0 )); then
              echo "No .deb files found in $ROOT/$variant" >&2
              exit 2
            fi
            for deb in "${debs[@]}"; do dpkg-deb -x "$deb" "$WORK/$variant"; done
          done

          BENCH="$WORK/baseline/usr/bin/tjbench"
          test -x "$BENCH" || { echo "Missing baseline tjbench" >&2; exit 3; }
          IMAGE="$WORK/benchmark.ppm"
          python3 "$ROOT/generate-ppm.py" "$IMAGE"

          echo
          echo "Package versions:"
          for variant in baseline restored; do
            for deb in "$ROOT/$variant"/*.deb; do
              printf '%s ' "$(dpkg-deb -f "$deb" Package)"
              dpkg-deb -f "$deb" Version
            done
          done

          for variant in baseline restored; do
            LIBDIR="$WORK/$variant/usr/lib/x86_64-linux-gnu"
            echo
            echo "=== Library resolution: $variant ==="
            LD_LIBRARY_PATH="$LIBDIR:$WORK/$variant/usr/lib" ldd "$BENCH" \
              | grep -E 'libturbojpeg|libjpeg\.so'
          done

          mkdir -p "$ROOT/results"
          for trial in 1 2 3; do
            for variant in baseline restored; do
              LIBDIR="$WORK/$variant/usr/lib/x86_64-linux-gnu"
              LOG="$ROOT/results/$variant-$trial.txt"
              echo
              echo "=== $variant, trial $trial ==="
              LD_LIBRARY_PATH="$LIBDIR:$WORK/$variant/usr/lib" "$BENCH" \
                "$IMAGE" 95 -rgb -quiet -nowrite -warmup 3 -benchtime 8 -subsamp 420 \
                2>&1 | tee "$LOG"
            done
          done

          echo
          echo "Results saved in: $ROOT/results/"
          echo "Compare the compression/decompression throughput; higher is faster."
          BENCH_SCRIPT

          chmod +x "$OUT/benchmark.sh" "$OUT/generate-ppm.py"

          cat > "$OUT/BENCHMARK.md" <<'MARKDOWN'
          # libjpeg-turbo Core 2 benchmark

          This is an isolated A/B test. Nothing is installed system-wide and no production release is created.

          ## Variants

          - Baseline: existing repository release core2-libjpeg-turbo-1-2.1.5-2-core2.1-20261011153748, built with -O3 -pipe -march=core2 -mtune=core2.
          - Restored-flags candidate: same Debian Bookworm source, built with -O3 -march=core2 -mtune=core2 -ffast-math -funroll-loops; LTO is disabled.

          This compares the added flags against the existing Core 2 package, not an -O2 vs -O3 build. The same baseline tjbench executable runs against each variant's shared libraries.

          ## Run it on the Dell Latitude D630

          1. Download and extract the core2-libjpeg-turbo-restored workflow artifact.
          2. Enter the extracted directory containing benchmark.sh, baseline/, and restored/.
          3. Run ./benchmark.sh

          The script generates a deterministic 2048x1536 RGB PPM input, checks which shared libraries are loaded, then runs three trials of JPEG quality 95 / 4:2:0 compression and decompression. Per-trial logs are saved under results/. It extracts packages into temporary directories and never installs or overwrites a system package.

          ## Interpretation

          - Compare compression and decompression throughput separately. Higher throughput is faster.
          - Use the median of three trials. Speedup percentage = 100 * (candidate median / baseline median - 1).
          - Confirm ldd shows libraries under the temporary baseline or restored directory, not /usr/lib.
          - Keep the laptop on AC power, close heavy tasks, and avoid concurrent builds.
          - Fast-math is not guaranteed to help an integer/SIMD-heavy JPEG codec. Retain the candidate only if any gain is repeatable and correctness is unchanged.
          - For a second check, repeat with the same PPM converted once from a real photograph.

          Upstream uses tjbench to measure compression/decompression throughput with fixed quality, pixel format, and warmup:
          https://libjpeg-turbo.org/About/Performance
          https://github.com/libjpeg-turbo/libjpeg-turbo/blob/main/simd/README.md
          MARKDOWN

          cat "$OUT/BENCHMARK.md"

      - name: Create checksums for baseline and restored packages
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/release-artifacts"
          find . -type f ! -name 'SHA256SUMS-restored.txt' ! -path './results/*' -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS-restored.txt

      - name: Upload isolated baseline, candidate packages, and benchmark instructions
        uses: actions/upload-artifact@v4
        with:
          name: core2-libjpeg-turbo-restored-${{ github.run_id }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Summarize test variant
        if: always()
        shell: bash
        run: |
          {
            echo "### libjpeg-turbo — restored-flags candidate"
            echo
            echo "Candidate flags: -O3 -march=core2 -mtune=core2 -ffast-math -funroll-loops"
            echo "Baseline: existing Core 2 release (-O3 -pipe -march=core2 -mtune=core2)"
            echo "LTO: disabled"
            echo "Publication: workflow artifact only; no release/index update"
          } >> "$GITHUB_STEP_SUMMARY"
