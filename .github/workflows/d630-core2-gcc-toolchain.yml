name: Core 2 GCC frozen machine controller
run-name: "Dispatch Core2 GCC build / #${{ github.run_number }}"

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/d630-core2-gcc-toolchain.yml"
      - ".github/workflows/d630-core2-gcc-frozen-build.yml"
      - ".github/workflows/d630-core2-system-package.yml"
      - "scripts/core2/frozen-gcc-build.sh"
  workflow_dispatch:
    inputs:
      reset_checkpoint:
        description: Ignore saved GCC build state and start clean
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: core2-gcc-controller-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/master'
    name: Dispatch resumable GCC build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Queue GCC 12 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESET_CHECKPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_checkpoint || false }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run d630-core2-gcc-frozen-build.yml --repo "$GITHUB_REPOSITORY" \
                --ref master -f reset_checkpoint="$RESET_CHECKPOINT"; then
              echo "Queued the resumable GCC build."
              exit 0
            fi
            echo "::warning::Workflow dispatch attempt $attempt failed; retrying."
            sleep "$((attempt * 10))"
          done
          echo "::error::Could not dispatch the GCC build workflow."
          exit 1
