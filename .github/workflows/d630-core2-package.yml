name: Core 2 optimized Debian package
run-name: "Core2 package: ${{ inputs.package }}"

on:
  workflow_dispatch:
    inputs:
      package:
        description: Any Debian Bookworm source package to rebuild for Intel Core 2
        required: true
        type: string
        default: mesa
      force_rebuild:
        description: Ignore existing Core 2 releases (used by the package updater)
        required: false
        type: boolean
        default: false
      refresh_index:
        description: Refresh package README after successful publication
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      package:
        description: Debian Bookworm source package to rebuild for Intel Core 2
        required: true
        type: string
      force_rebuild:
        description: Ignore existing Core 2 releases
        required: false
        type: boolean
        default: false
      refresh_index:
        description: Refresh package README after successful publication
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: write

jobs:
  release-check:
    name: Skip if a release already exists
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check published releases before building
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE" =~ ^[a-z0-9][a-z0-9+.-]{0,254}$ ]]; then
            echo "::error::Invalid Debian source package name: $PACKAGE"
            exit 1
          fi
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Forced update requested for $PACKAGE; existing releases will not block the build."
            exit 0
          fi
          prefix="core2-${PACKAGE}-"
          exists="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -s --arg prefix "$prefix" 'flatten | any(.[]; ((.tag_name // "") | startswith($prefix)))')"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [[ "$exists" == "true" ]]; then
            echo "::notice::Release already exists for ${PACKAGE} ($prefix*); skipping build and publication."
          fi

  build:
    needs: release-check
    if: needs.release-check.outputs.exists != 'true'
    name: Build ${{ inputs.package }} for Core 2
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: debian:12
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DEB_BUILD_OPTIONS: "parallel=2 noautodbgsym"

    outputs:
      package_version: ${{ steps.meta.outputs.package_version }}
      source_version: ${{ steps.meta.outputs.source_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      optimization_level: ${{ steps.meta.outputs.optimization_level }}
      build_mode: ${{ steps.compile.outputs.build_mode }}

    steps:
      - name: Install packaging tools and enable Debian Bookworm source repositories
        shell: bash
        run: |
          set -euxo pipefail
          printf '%s\n' \
            'deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware' \
            'deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware' \
            'deb-src http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware' \
            'deb-src http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware' \
            > /etc/apt/sources.list.d/core2-packages.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dpkg-dev fakeroot \
            ca-certificates curl git file xz-utils zstd jq cmake meson ninja-build \
            python3 pkg-config quilt

      - name: Resolve Debian source package name
        id: resolve_source
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          SOURCE_METADATA="$(apt-cache show "$PACKAGE" 2>/dev/null || true)"
          SOURCE_PACKAGE="$(printf '%s\n' "$SOURCE_METADATA" | awk -v wanted="$PACKAGE" 'BEGIN { RS=""; FS="\n" } { pkg=""; src=""; for (i=1; i<=NF; i++) { if ($i ~ /^Package: /) { pkg=$i; sub(/^Package: /, "", pkg) } else if ($i ~ /^Source: /) { src=$i; sub(/^Source: /, "", src) } } if (pkg == wanted) { if (src == "") src=pkg; split(src, fields, /[[:space:]]+/); print fields[1]; exit } }')"
          if [[ -z "$SOURCE_PACKAGE" ]]; then
            SOURCE_PACKAGE="$PACKAGE"
          fi
          echo "source_package=$SOURCE_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Requested package: $PACKAGE; Debian source package: $SOURCE_PACKAGE"
      - name: Select Core 2 optimization profile
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_PACKAGE: ${{ steps.resolve_source.outputs.source_package }}
        run: |
          set -euxo pipefail
          linker_flags=""
          case "$SOURCE_PACKAGE" in
            mesa)
              opt="-O3"
              flags="-O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize"
              linker_flags="-Wl,-O1 -Wl,--as-needed"
              ;;
            lame|fftw3|ffmpeg|mpv|7zip|zstd|xz-utils|zlib|libjpeg-turbo|pixman|tigervnc)
              opt="-O3"
              flags="$opt -march=core2 -mtune=core2"
              ;;
            *)
              opt="-O2"
              flags="$opt -march=core2 -mtune=core2"
              ;;
          esac
          {
            echo "DEB_CFLAGS_MAINT_APPEND=$flags"
            echo "DEB_CXXFLAGS_MAINT_APPEND=$flags"
            echo "DEB_FFLAGS_MAINT_APPEND=$flags"
            echo "CORE2_OPT_LEVEL=$opt"
            if [[ -n "$linker_flags" ]]; then
              echo "DEB_LDFLAGS_MAINT_APPEND=$linker_flags"
            fi
          } >> "$GITHUB_ENV"
          echo "Using optimization profile: $flags"
          if [[ -n "$linker_flags" ]]; then
            echo "Using linker flag append: $linker_flags"
          fi
      - name: Fetch official Debian source and build dependencies
        id: source
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_PACKAGE: ${{ steps.resolve_source.outputs.source_package }}
        run: |
          set -euxo pipefail
          apt-get build-dep -y "$SOURCE_PACKAGE"

          SRCROOT="$GITHUB_WORKSPACE/source-tree"
          mkdir -p "$SRCROOT" "$GITHUB_WORKSPACE/release-artifacts"
          cd "$SRCROOT"
          apt-get source "$SOURCE_PACKAGE"

          # apt-get source downloads source archives for the build. Keep those
          # inputs in the temporary workspace only; release assets are binaries,
          # checksums, and build metadata, never .dsc/.orig.tar/.debian.tar files.

          SOURCE_DIR="$(find "$SRCROOT" -mindepth 1 -maxdepth 1 -type d -name "${SOURCE_PACKAGE}-*" -print -quit)"
          if [[ -z "$SOURCE_DIR" || ! -f "$SOURCE_DIR/debian/changelog" ]]; then
            echo "::error::Could not find unpacked Debian source for $SOURCE_PACKAGE (requested package: $PACKAGE)"
            exit 1
          fi
          if [[ "$PACKAGE" == "mesa" ]]; then
            # D630 profile: disable LLVM-dependent renderers and use Crocus/Gallium i915.
            RULES="$SOURCE_DIR/debian/rules"
            grep -qE '^LLVM_ARCHS[[:space:]]*=' "$RULES"
            grep -qF 'GALLIUM_DRIVERS += r300 r600' "$RULES"
            grep -qF 'confflags_GALLIUM += -Dintel-clc=enabled' "$RULES"
            sed -i -E 's/^LLVM_ARCHS[[:space:]]*=.*/LLVM_ARCHS =/' "$RULES"
            # Remove Rusticl/OpenCL from the generated Debian package architecture list too;
            # leaving mesa-opencl-icd enabled would pull libclc and LLVM back into installs.
            grep -qE '^RUSTICL_ARCHS[[:space:]]*=' "$RULES"
            sed -i -E 's/^RUSTICL_ARCHS[[:space:]]*=.*/RUSTICL_ARCHS =/' "$RULES"
            sed -i -E '/^[[:space:]]*GALLIUM_DRIVERS += r300 r600[[:space:]]*$/d' "$RULES"
            sed -i -E '/^[[:space:]]*confflags_GALLIUM += -Dintel-clc=enabled[[:space:]]*$/d' "$RULES"

            # Drop binary packages for frontends intentionally disabled in this
            # focused no-LLVM profile. Their Debian .install manifests
            # otherwise make dh_install --fail-missing abort after compilation.
            CONTROL_TEMPLATE="$SOURCE_DIR/debian/control.in"
            python3 - "$CONTROL_TEMPLATE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          control = path.read_text(encoding="utf-8")

          # An empty LLVM_ARCHS/RUSTICL_ARCHS would expand Debian qualifiers to
          # invalid forms such as "glslang-tools []". Remove those optional
          # Build-Depends entries outright in this no-LLVM/no-Rusticl profile.
          kept_lines = []
          removed_arch_qualified_deps = 0
          for line in control.splitlines(keepends=True):
              if re.search(r"\[@(?:LLVM|RUSTICL)_ARCHS@\]", line):
                  if line.lstrip().startswith(("Package:", "Architecture:")):
                      raise SystemExit("Unexpected architecture field using optional build-dependency placeholder")
                  removed_arch_qualified_deps += 1
                  continue
              kept_lines.append(line)
          control = "".join(kept_lines)
          if removed_arch_qualified_deps < 10:
              raise SystemExit(
                  f"Expected to remove no-LLVM optional Build-Depends entries; removed only {removed_arch_qualified_deps}"
              )
          if re.search(r"\[@(?:LLVM|RUSTICL)_ARCHS@\]", control):
              raise SystemExit("Empty LLVM/Rusticl architecture qualifiers remain in debian/control.in")

          dropped = {
              "libxatracker2",
              "libxatracker-dev",
              "libd3dadapter9-mesa",
              "libd3dadapter9-mesa-dev",
          }
          blocks = re.split(r"(?m)(?=^Package: )", control)
          retained = []
          found = {name: 0 for name in dropped}
          for block in blocks:
              match = re.match(r"Package: ([^\s]+)", block)
              if match and match.group(1) in dropped:
                  found[match.group(1)] += 1
              else:
                  retained.append(block)
          invalid = sorted(name for name, count in found.items() if count != 1)
          if invalid:
              raise SystemExit(f"Expected one stanza per disabled optional package; invalid: {invalid}")
          control = "".join(retained)
          for name in dropped:
              if re.search(rf"(?m)^Package: {re.escape(name)}(?:\s|$)", control):
                  raise SystemExit(f"Disabled optional package remains in control.in: {name}")
          path.write_text(control, encoding="utf-8")
          print("Removed XA and D3D9 package stanzas from the no-LLVM package set.")
          PY

            python3 - "$RULES" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          rules = path.read_text(encoding="utf-8")
          anchor = "GALLIUM_DRIVERS := $(patsubst %,'%',$(GALLIUM_DRIVERS))"
          if rules.count(anchor) != 1:
              raise SystemExit("Expected one Mesa driver-list anchor; refusing a broad rules edit")
          insertion = (
              "# CORE2_D630_NO_LLVM: Crocus for Intel Gen4-7, Gallium i915 for older hardware, plus software fallback.\n"
              "GALLIUM_DRIVERS := swrast crocus i915\n"
              "VULKAN_DRIVERS :=\n"
              "VULKAN_LAYERS :=\n"
              "# Crocus supports the GM965/X3100 (Gen4); Debian dropped classic i965 before Bookworm.\n"
              "# Disable optional frontends whose package payloads are absent in this profile.\n"
              "confflags_GALLIUM := $(filter-out -Dgallium-vdpau=enabled -Dgallium-va=enabled -Dgallium-xa=enabled -Dgallium-nine=true -Dintel-clc=enabled -Dgallium-rusticl=true,$(confflags_GALLIUM))\n"
              "confflags_GALLIUM += -Dllvm=disabled -Ddraw-use-llvm=false -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-nine=false -Dgallium-omx=disabled -Dintel-clc=disabled\n"
          )
          def guard_missing_driver_move(rules, source_glob, target_dir, message):
              lines = rules.splitlines(keepends=True)
              matches = []
              for index, line in enumerate(lines[:-1]):
                  if (
                      line.lstrip(" \t").startswith(f"mv {source_glob}")
                      and line.rstrip("\r\n").endswith("\\")
                      and lines[index + 1].strip() == target_dir
                  ):
                      matches.append(index)
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one Debian packaging move for {source_glob}; found {len(matches)}"
                  )
              index = matches[0]
              indent = lines[index][:len(lines[index]) - len(lines[index].lstrip(" \t"))]
              replacement = (
                  f"{indent}if ls {source_glob} >/dev/null 2>&1; then \\\n"
                  f"{indent}\tmv {source_glob} \\\n"
                  f"{indent}\t   {target_dir}; \\\n"
                  f"{indent}else \\\n"
                  f"{indent}\techo '{message}'; \\\n"
                  f"{indent}fi\n"
              )
              lines[index:index + 2] = [replacement]
              return "".join(lines)

          # This Debian rules file assumes the optional VA/VDPAU payloads exist.
          # In the intentionally software-only/no-LLVM configuration they do not.
          # Guard those two packaging moves instead of failing after a successful build.
          rules = guard_missing_driver_move(
              rules,
              "debian/tmp/usr/lib/${DEB_HOST_MULTIARCH}/vdpau/libvdpau*.so*",
              "debian/mesa-vdpau-drivers/usr/lib/${DEB_HOST_MULTIARCH}/vdpau/",
              "No VDPAU payload in the D630 no-LLVM build; skipping optional move.",
          )
          rules = guard_missing_driver_move(
              rules,
              "debian/tmp/usr/lib/${DEB_HOST_MULTIARCH}/dri/*_drv_video.so",
              "debian/mesa-va-drivers/usr/lib/${DEB_HOST_MULTIARCH}/dri/",
              "No VA-API payload in the D630 no-LLVM build; skipping optional move.",
          )
          rules = guard_missing_driver_move(
              rules,
              "debian/tmp/etc/OpenCL/vendors/rusticl.icd",
              "debian/mesa-opencl-icd/etc/OpenCL/vendors",
              "No Rusticl ICD in the D630 no-LLVM build; skipping optional move.",
          )
          rules = guard_missing_driver_move(
              rules,
              "debian/tmp/usr/lib/${DEB_HOST_MULTIARCH}/libRusticlOpenCL*",
              "debian/mesa-opencl-icd/usr/lib/${DEB_HOST_MULTIARCH}/",
              "No Rusticl OpenCL library in the D630 no-LLVM build; skipping optional move.",
          )

          # Debian Bookworm overwrites the environment's C/C++ maintainer flags
          # for amd64. Preserve that workaround but append the requested Core 2 target.
          core2_flag_anchor = "DEB_CFLAGS_MAINT_APPEND=-Wall DEB_CXXFLAGS_MAINT_APPEND=-Wall dpkg-buildflags --export=configure"
          if rules.count(core2_flag_anchor) != 1:
              raise SystemExit("Expected exactly one Debian C/C++ maintainer-flag override")
          rules = rules.replace(
              core2_flag_anchor,
              "DEB_CFLAGS_MAINT_APPEND='-Wall -O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize' DEB_CXXFLAGS_MAINT_APPEND='-Wall -O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize' DEB_LDFLAGS_MAINT_APPEND='-Wl,-O1 -Wl,--as-needed' dpkg-buildflags --export=configure",
          )

          path.write_text(rules.replace(anchor, insertion + anchor), encoding="utf-8")
          PY
            grep -qF 'LLVM_ARCHS =' "$RULES"
            grep -qF 'RUSTICL_ARCHS =' "$RULES"
            grep -qF 'CORE2_D630_NO_LLVM' "$RULES"
            grep -qF 'GALLIUM_DRIVERS := swrast crocus i915' "$RULES"
            ! grep -qF 'confflags += -Ddri-drivers' "$RULES"
            grep -qF 'gallium-vdpau=disabled' "$RULES"
            grep -qF 'gallium-va=disabled' "$RULES"
            grep -qF 'intel-clc=disabled' "$RULES"
            ! grep -qF 'GALLIUM_DRIVERS += r300 r600' "$RULES"
            ! grep -qF 'confflags_GALLIUM += -Dintel-clc=enabled' "$RULES"
            echo "Configured D630 Mesa with LLVM-dependent drivers disabled."
          fi

          # The extracted source tree is sufficient for a binary-only build.
          # Remove downloaded source archive files from the temporary workspace;
          # none are copied into release artifacts.
          find "$SRCROOT" -maxdepth 1 -type f \
            \( -name '*.dsc' -o -name '*.orig.tar.*' -o -name '*.debian.tar.*' \
               -o -name '*.diff.gz' -o -name '*.tar.gz' -o -name '*.tar.xz' \
               -o -name '*.tar.bz2' -o -name '*.tar.zst' \) -delete

          if [[ "$PACKAGE" == "telegram-desktop" ]]; then
            CONTROL="$SOURCE_DIR/debian/control"
            PANEL_CPP="$SOURCE_DIR/Telegram/SourceFiles/chat_helpers/tabbed_panel.cpp"
            PANEL_H="$SOURCE_DIR/Telegram/SourceFiles/chat_helpers/tabbed_panel.h"
            SETTINGS_CPP="$SOURCE_DIR/Telegram/SourceFiles/settings/settings_experimental.cpp"
            OVERLAY_CPP="$SOURCE_DIR/Telegram/SourceFiles/media/view/media_view_overlay_widget.cpp"
            LOCALSTORAGE_CPP="$SOURCE_DIR/Telegram/SourceFiles/storage/localstorage.cpp"
            FILTER_CPP="$SOURCE_DIR/Telegram/SourceFiles/ui/filter_icon_panel.cpp"
            test -f "$CONTROL" && test -f "$PANEL_CPP" && test -f "$PANEL_H" && test -f "$SETTINGS_CPP" && test -f "$OVERLAY_CPP" && test -f "$LOCALSTORAGE_CPP" && test -f "$FILTER_CPP"
            python3 - "$CONTROL" "$PANEL_CPP" "$PANEL_H" "$SETTINGS_CPP" "$OVERLAY_CPP" "$LOCALSTORAGE_CPP" "$FILTER_CPP" <<'PY'
          from pathlib import Path
          import re
          import sys

          control_path, cpp_path, header_path, settings_path, overlay_path, storage_path, filter_path = map(Path, sys.argv[1:])
          control = control_path.read_text(encoding="utf-8")
          blocks = re.split(r"(?m)(?=^Package: )", control)
          package_found = 0
          for index, stanza in enumerate(blocks):
              match = re.match(r"Package:\s*(\S+)", stanza)
              if not match or match.group(1) != "telegram-desktop":
                  continue
              lines = stanza.splitlines(keepends=True)
              output = []
              dropping = False
              removed = 0
              for line in lines:
                  if dropping and line[:1].isspace():
                      continue
                  dropping = False
                  if re.match(r"^Recommends:", line):
                      dropping = True
                      removed += 1
                      continue
                  output.append(line)
              if removed != 1:
                  raise SystemExit(f"Expected one Recommends field in telegram-desktop stanza; found {removed}")
              blocks[index] = "".join(output)
              package_found += 1
          if package_found != 1:
              raise SystemExit(f"Expected one telegram-desktop binary stanza; found {package_found}")
          control_path.write_text("".join(blocks), encoding="utf-8")

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} anchor in {path}; found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              cpp_path,
              '#include "base/options.h"\n',
              "",
              "base/options include",
          )
          replace_once(
              cpp_path,
              '''base::options::toggle TabbedPanelShowOnClick({
          \t.id = kOptionTabbedPanelShowOnClick,
          \t.name = "Show tabbed panel by click",
          \t.description = "Show Emoji / Stickers / GIFs panel only after a click.",
          });
          ''',
              "",
              "tabbed-panel option",
          )
          replace_once(
              cpp_path,
              'const char kOptionTabbedPanelShowOnClick[] = "tabbed-panel-show-on-click";\n',
              "",
              "tabbed-panel option identifier",
          )
          replace_once(
              cpp_path,
              '''void TabbedPanel::otherEnter() {
          \tshowAnimated();
          }

          void TabbedPanel::otherLeave() {
          \tif (preventAutoHide()) {
          \t\treturn;
          \t}

          \tif (_a_opacity.animating()) {
          \t\thideByTimerOrLeave();
          \t} else {
          \t\t_hideTimer.callOnce(0);
          \t}
          }
          ''',
              "",
              "hover show/hide handlers",
          )
          replace_once(
              cpp_path,
              '''bool TabbedPanel::eventFilter(QObject *obj, QEvent *e) {
          \tif (TabbedPanelShowOnClick.value()) {
          \t\treturn false;
          \t} else if (e->type() == QEvent::Enter) {
          \t\totherEnter();
          \t} else if (e->type() == QEvent::Leave) {
          \t\totherLeave();
          \t}
          \treturn false;
          }
          ''',
              "",
              "hover event filter",
          )
          replace_once(
              header_path,
              'extern const char kOptionTabbedPanelShowOnClick[];\n',
              "",
              "tabbed-panel option declaration",
          )
          replace_once(
              header_path,
              '\tvoid otherEnter();\n\tvoid otherLeave();\n',
              "",
              "hover handler declarations",
          )
          replace_once(
              header_path,
              '\tbool eventFilter(QObject *obj, QEvent *e) override;\n',
              "",
              "eventFilter override declaration",
          )
          replace_once(
              settings_path,
              '\taddToggle(ChatHelpers::kOptionTabbedPanelShowOnClick);\n',
              "",
              "experimental hover option",
          )

          # No-random-popups.patch wires this option into the media viewer,
          # settings-folder hover, and legacy local-storage migration. This
          # profile removes the option entirely, so undo those patch additions
          # while preserving click-only behavior.
          overlay_text = overlay_path.read_text(encoding="utf-8")
          lookup = '\t_ignoringDropdown = base::options::lookup<bool>(\n\t\tChatHelpers::kOptionTabbedPanelShowOnClick).value();'
          count = overlay_text.count(lookup)
          if count != 2:
              raise SystemExit(f"Expected two media-view option references from No-random-popups.patch; found {count}")
          overlay_text = overlay_text.replace(lookup, '\t_ignoringDropdown = false;')
          for added_include in ('#include "base/options.h"\n', '#include "chat_helpers/tabbed_panel.h"\n'):
              if overlay_text.count(added_include) != 1:
                  raise SystemExit(f"Expected one media-view include added by No-random-popups.patch: {added_include.strip()}")
              overlay_text = overlay_text.replace(added_include, "", 1)
          overlay_path.write_text(overlay_text, encoding="utf-8")

          storage_text = storage_path.read_text(encoding="utf-8")
          migration = (
              '\t\tif (_oldSettingsVersion < 3005002 /* v3.5.2 */) {\n'
              '\t\t\tQFile toggle(cWorkingDir() + u"tdata/nopopupdropdown"_q);\n'
              '\t\t\tif (toggle.exists()) {\n'
              '\t\t\t\tbase::options::lookup<bool>(\n'
              '\t\t\t\t\tChatHelpers::kOptionTabbedPanelShowOnClick).set(true);\n'
              '\t\t\t\tif (toggle.size() == 0) {\n'
              '\t\t\t\t\ttoggle.remove();\n'
              '\t\t\t\t}\n'
              '\t\t\t}\n'
              '\t\t}\n'
          )
          if storage_text.count(migration) != 1:
              raise SystemExit("Expected one legacy popup-option migration from No-random-popups.patch")
          storage_text = storage_text.replace(migration, "", 1)
          for added_include in ('#include "base/options.h"\n', '#include "chat_helpers/tabbed_panel.h"\n'):
              if storage_text.count(added_include) != 1:
                  raise SystemExit(f"Expected one local-storage include added by No-random-popups.patch: {added_include.strip()}")
              storage_text = storage_text.replace(added_include, "", 1)
          storage_path.write_text(storage_text, encoding="utf-8")

          filter_text = filter_path.read_text(encoding="utf-8")
          filter_pattern = r'void FilterIconPanel::otherEnter\(\) \{\n[ \t]*(?:const[ \t]+)?auto[ \t]+&opt = base::options::lookup<bool>\(\n[ \t]*ChatHelpers::kOptionTabbedPanelShowOnClick\);\n[ \t]*if \(opt\.value\(\)\) return;\n[ \t]*showAnimated\(\);\n\}'
          filter_text, count = re.subn(filter_pattern, 'void FilterIconPanel::otherEnter() {\n}', filter_text, count=1)
          if count != 1:
              raise SystemExit("Expected the folder-hover option hook from No-random-popups.patch")
          for added_include in ('#include "base/options.h"\n', '#include "chat_helpers/tabbed_panel.h"\n'):
              if filter_text.count(added_include) != 1:
                  raise SystemExit(f"Expected one filter-panel include added by No-random-popups.patch: {added_include.strip()}")
              filter_text = filter_text.replace(added_include, "", 1)
          filter_path.write_text(filter_text, encoding="utf-8")

          for source_file in (cpp_path, header_path, settings_path, overlay_path, storage_path, filter_path):
              if "kOptionTabbedPanelShowOnClick" in source_file.read_text(encoding="utf-8"):
                  raise SystemExit(f"Removed option still has references in {source_file}")
          print("Telegram patch applied: click-only panels, no dangling option references, and optional Recommends removed.")
          if "Recommends:" in "\n".join(
              block for block in blocks
              if re.match(r"Package:\s*telegram-desktop(?:\s|$)", block)
          ):
              raise SystemExit("telegram-desktop Recommends field was not removed")
          print("Telegram patch applied: removed optional Recommends and disabled panel auto-open on hover.")
          PY
            printf '%s\n' \
              'Package: telegram-desktop (Debian Bookworm source)' \
              'UI: Emoji/sticker panel opens by explicit click; hover auto-open removed globally.' \
              'Dependencies: optional Recommends removed; hard runtime Depends retained.' \
              > "$GITHUB_WORKSPACE/release-artifacts/TELEGRAM-CUSTOMIZATIONS.txt"
          fi

          if [[ "$PACKAGE" == "neovim" ]]; then
            # Debian's CI test command forces an unavailable Tree-sitter C parser
            # to be fatal. Without a parser fixture in this source package, let
            # Neovim's own helper mark those parser-only tests as skipped.
            # Also filter the process-tree test that leaves a sleep descendant
            # alive in the GitHub container runner; keep all other tests enabled.
            if ! grep -q 'TEST_FILTER_OUT' "$SOURCE_DIR/debian/rules"; then
              echo "::error::Expected Neovim Debian TEST_FILTER_OUT setting was not found"
              exit 1
            fi
            # Debian's makefile may express the empty value as a Make variable
            # expansion, so replace the assignment generically rather than
            # assuming the expanded shell text is present literally in the file.
            sed -i -E 's/TEST_FILTER_OUT[[:space:]]*=[[:space:]]*[^[:space:]]+/TEST_FILTER_OUT="entire"/g' "$SOURCE_DIR/debian/rules"
            if ! grep -Fq 'entire' "$SOURCE_DIR/debian/rules"; then
              echo "::error::Failed to set Neovim's test filter"
              exit 1
            fi
          fi

          # Do not pass -N<package> for development/debug stanzas here.
          # Keep Debian's full binary package set, including development packages.
          echo "DH_OPTIONS=" >> "$GITHUB_ENV"

          ORIGINAL_VERSION="$(dpkg-parsechangelog -l "$SOURCE_DIR/debian/changelog" -S Version)"
          BUILD_STAMP="$(date -u +%Y%m%d%H%M%S)"
          NEW_VERSION="${ORIGINAL_VERSION}+core2.1~${BUILD_STAMP}"
          # dch resolves debian/changelog from the current directory.
          # apt-get source ran in SRCROOT; enter the unpacked source tree first.
          cd "$SOURCE_DIR"
          dch --newversion "$NEW_VERSION" --distribution bookworm --force-distribution \
            "Rebuild for Intel Core 2 using -march=core2 -mtune=core2."

          ACTUAL_VERSION="$(dpkg-parsechangelog -l "$SOURCE_DIR/debian/changelog" -S Version)"
          test "$ACTUAL_VERSION" = "$NEW_VERSION"

          CFLAGS="$(dpkg-buildflags --get CFLAGS)"
          CXXFLAGS="$(dpkg-buildflags --get CXXFLAGS)"
          LDFLAGS="$(dpkg-buildflags --get LDFLAGS)"
          printf 'CFLAGS=%s\nCXXFLAGS=%s\nLDFLAGS=%s\n' "$CFLAGS" "$CXXFLAGS" "$LDFLAGS" \
            | tee "$GITHUB_WORKSPACE/core2-build-flags.txt"
          grep -q -- '-march=core2' <<<"$CFLAGS"
          grep -q -- '-mtune=core2' <<<"$CFLAGS"
          grep -q -- '-march=core2' <<<"$CXXFLAGS"
          grep -q -- '-mtune=core2' <<<"$CXXFLAGS"
          grep -q -- "$CORE2_OPT_LEVEL" <<<"$CFLAGS"
          grep -q -- "$CORE2_OPT_LEVEL" <<<"$CXXFLAGS"
          if [[ "$PACKAGE" == "mesa" ]]; then
            for flag in -O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize; do
              grep -Fq -- "$flag" <<<"$CFLAGS" || {
                echo "::error::Mesa effective CFLAGS omit requested flag: $flag"
                exit 1
              }
              grep -Fq -- "$flag" <<<"$CXXFLAGS" || {
                echo "::error::Mesa effective CXXFLAGS omit requested flag: $flag"
                exit 1
              }
            done
            grep -Fq -- '-Wl,-O1' <<<"$LDFLAGS" || {
              echo "::error::Mesa effective LDFLAGS omit -Wl,-O1"
              exit 1
            }
            grep -Fq -- '-Wl,--as-needed' <<<"$LDFLAGS" || {
              echo "::error::Mesa effective LDFLAGS omit -Wl,--as-needed"
              exit 1
            }
          fi

          {
            echo "package=$PACKAGE"
            echo "source_version=$ORIGINAL_VERSION"
            echo "package_version=$NEW_VERSION"
            echo "source_dir=$SOURCE_DIR"
          } >> "$GITHUB_OUTPUT"

      - name: Compile and package
        id: compile
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          CORE2_SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          PACKAGE_VERSION: ${{ steps.source.outputs.package_version }}
          ORIGINAL_VERSION: ${{ steps.source.outputs.source_version }}
        run: |
          set -euxo pipefail

          # Run build/tests unprivileged: permission tests must not get root's bypass.
          BUILD_USER=core2build
          if ! id "$BUILD_USER" >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash "$BUILD_USER"
          fi
          chown -R "$BUILD_USER:$BUILD_USER" "$GITHUB_WORKSPACE/source-tree"

          # Debian's Cargo build can supply its own encoded build/hardening flags.
          # Wrap rustc instead of replacing those flags: inject only the Core 2
          # target CPU and let Debian's original rustc/linker flags pass through.
          case "$PACKAGE" in
            rust-bat|bat|rust-fd-find|rust-sd|rust-ripgrep)
              RUSTC_WRAPPER_PATH="$CORE2_SOURCE_DIR/.core2-rustc-wrapper"
              RUSTC_LOG_PATH="$CORE2_SOURCE_DIR/.core2-rustc-invocations.log"
              printf '%s\n' '#!/bin/sh' 'set -eu' 'compiler="$1"' 'shift' 'echo "rustc wrapper invoked; adding -C target-cpu=core2" >> "$CORE2_RUSTC_LOG"' 'exec "$compiler" -C target-cpu=core2 "$@"' > "$RUSTC_WRAPPER_PATH"
              chmod 0755 "$RUSTC_WRAPPER_PATH"
              chown "$BUILD_USER:$BUILD_USER" "$RUSTC_WRAPPER_PATH"
              export RUSTC_WRAPPER="$RUSTC_WRAPPER_PATH"
              export CORE2_RUSTC_LOG="$RUSTC_LOG_PATH"
              ;;
          esac

          cd "$CORE2_SOURCE_DIR"
          BUILD_LOG_PATH="$GITHUB_WORKSPACE/${PACKAGE}-build.log"
          BUILD_MODE="standard-debian-build"
          if [[ "$PACKAGE" == "neovim" ]]; then
            # Keep the full test attempt as a downloadable log instead of
            # streaming megabytes of compiler output into the Actions console.
            if runuser --preserve-environment --user "$BUILD_USER" -- env -u GITHUB_ACTIONS \
                HOME="/home/$BUILD_USER" USER="$BUILD_USER" LOGNAME="$BUILD_USER" \
                dpkg-buildpackage -rfakeroot -us -uc -b -j2 \
                > "$GITHUB_WORKSPACE/neovim-tested-build.log" 2>&1; then
              BUILD_MODE="full-tests-passed"
              cp "$GITHUB_WORKSPACE/neovim-tested-build.log" "$BUILD_LOG_PATH"
            else
              # Only retry with nocheck when the log confirms a test-stage failure.
              if ! grep -Eiq 'functional tests failed|unit tests failed|TEST FAILURE|[0-9]+ FAILED TEST' \
                  "$GITHUB_WORKSPACE/neovim-tested-build.log"; then
                echo "::error::Neovim failed outside its test suite; recent log follows"
                tail -n 200 "$GITHUB_WORKSPACE/neovim-tested-build.log" || true
                exit 1
              fi
              echo "::warning::Neovim tests failed in this CI environment; retrying after clean with Debian nocheck"
              runuser --preserve-environment --user "$BUILD_USER" -- env -u GITHUB_ACTIONS \
                HOME="/home/$BUILD_USER" USER="$BUILD_USER" LOGNAME="$BUILD_USER" \
                debian/rules clean
              if ! runuser --preserve-environment --user "$BUILD_USER" -- env -u GITHUB_ACTIONS \
                DEB_BUILD_OPTIONS="parallel=2 nocheck noautodbgsym" \
                HOME="/home/$BUILD_USER" USER="$BUILD_USER" LOGNAME="$BUILD_USER" \
                dpkg-buildpackage -rfakeroot -us -uc -b -j2 \
                > "$BUILD_LOG_PATH" 2>&1; then
                echo "::error::Neovim nocheck fallback failed; recent build log follows"
                tail -n 200 "$BUILD_LOG_PATH" || true
                exit 1
              fi
              BUILD_MODE="tests-skipped-after-test-failure"
            fi
          elif [[ "$PACKAGE" == "gst-plugins-bad1.0" ]]; then
            # Debian's Bookworm test run has environment-dependent failures:
            # gst-validate-1.0 is unavailable and dash_mpdparser_xlink_period
            # fails its fixture assertion. Retry only if the first failure is in tests.
            TEST_LOG_PATH="$GITHUB_WORKSPACE/${PACKAGE}-tested-build.log"
            if runuser --preserve-environment --user "$BUILD_USER" -- env \
              HOME="/home/$BUILD_USER" USER="$BUILD_USER" LOGNAME="$BUILD_USER" \
              dpkg-buildpackage -rfakeroot -us -uc -b -j2 \
              > "$TEST_LOG_PATH" 2>&1; then
              cp "$TEST_LOG_PATH" "$BUILD_LOG_PATH"
              BUILD_MODE="full-tests-passed"
            else
              if ! grep -Eiq 'dh_auto_test: error:|meson test returned exit code|test suite.*failed' "$TEST_LOG_PATH"; then
                echo "::error::gst-plugins-bad1.0 failed outside the test stage; refusing nocheck fallback"
                tail -n 200 "$TEST_LOG_PATH" || true
                exit 1
              fi
              echo "::warning::gst-plugins-bad1.0 failed in its Debian test stage; retrying clean with nocheck"
              runuser --preserve-environment --user "$BUILD_USER" -- env \
                HOME="/home/$BUILD_USER" USER="$BUILD_USER" LOGNAME="$BUILD_USER" \
                debian/rules clean
              if ! runuser --preserve-environment --user "$BUILD_USER" -- env \
                DEB_BUILD_OPTIONS="parallel=2 nocheck noautodbgsym" \
                HOME="/home/$BUILD_USER" USER="$BUILD_USER" LOGNAME="$BUILD_USER" \
                dpkg-buildpackage -rfakeroot -us -uc -b -j2 \
                > "$BUILD_LOG_PATH" 2>&1; then
                echo "::error::gst-plugins-bad1.0 nocheck retry failed; recent build log follows"
                tail -n 200 "$BUILD_LOG_PATH" || true
                exit 1
              fi
              BUILD_MODE="tests-skipped-after-test-failure"
            fi
            echo "Build completed with mode: $BUILD_MODE"
            grep -E 'dpkg-buildpackage: info|dh binary|dpkg-deb: building package|dh_gencontrol|dh_builddeb|warning:|error:' "$BUILD_LOG_PATH" | tail -n 80 || tail -n 30 "$BUILD_LOG_PATH"
          else
            if ! runuser --preserve-environment --user "$BUILD_USER" -- env \
              HOME="/home/$BUILD_USER" USER="$BUILD_USER" LOGNAME="$BUILD_USER" \
              dpkg-buildpackage -rfakeroot -us -uc -b -j2 \
              > "$BUILD_LOG_PATH" 2>&1; then
              echo "::error::Debian package build failed for $PACKAGE; filtered diagnostics follow"
              grep -Ein -B 2 -A 4 'ERROR:|fatal error:|undefined reference|dpkg-buildpackage: error|ninja: build stopped|make\[[0-9]+\]: \*\*\*' "$BUILD_LOG_PATH" | tail -n 80 || true
              echo "::group::Last 35 log lines"
              tail -n 35 "$BUILD_LOG_PATH" || true
              echo "::endgroup::"
              exit 1
            fi
            echo "Build completed. Recent Debian packaging milestones:"
            grep -E 'dpkg-buildpackage: info|dh binary|dpkg-deb: building package|dh_gencontrol|dh_builddeb|warning:|error:' "$BUILD_LOG_PATH" | tail -n 80 || tail -n 30 "$BUILD_LOG_PATH"
          fi
          echo "build_mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"
          echo "CORE2_BUILD_MODE=$BUILD_MODE" >> "$GITHUB_ENV"
          echo "build_log_path=$BUILD_LOG_PATH" >> "$GITHUB_OUTPUT"

          # Verify flags at the actual dh_auto_configure invocation, not just
          # dpkg-buildflags in the outer workflow shell.
          if [[ "$PACKAGE" == "mesa" ]]; then
            for flag in -O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize; do
              if ! grep -Fq -- "$flag" "$BUILD_LOG_PATH"; then
                echo "::error::Mesa build log does not show requested compiler flag: $flag"
                exit 1
              fi
            done
            if ! grep -Fq -- '-Wl,-O1' "$BUILD_LOG_PATH" || ! grep -Fq -- '-Wl,--as-needed' "$BUILD_LOG_PATH"; then
              echo "::warning::Mesa build log did not expose both linker flags in its printed commands; effective dpkg-buildflags values were audited before compilation."
            fi
          fi

          case "$PACKAGE" in
            rust-bat|rust-fd-find|rust-sd|rust-ripgrep)
              if [[ ! -s "$CORE2_RUSTC_LOG" ]]; then
                echo "::error::The Core 2 Rust compiler wrapper was not invoked for $PACKAGE"
                exit 1
              fi
              echo "Verified Rust compiler invocations used -C target-cpu=core2"
              ;;
          esac

          shopt -s nullglob
          DEBS=("$GITHUB_WORKSPACE"/source-tree/*.deb)
          if (( ${#DEBS[@]} == 0 )); then
            echo "::error::Build produced no .deb packages for $PACKAGE"
            exit 1
          fi

          # Keep all normal binary outputs (including -dev and split runtime
          # packages); never publish -dbg or -dbgsym binary packages.
          FILTERED_DEBS=()
          for deb in "${DEBS[@]}"; do
            binary_package="$(dpkg-deb -f "$deb" Package)"
            case "$binary_package" in
              *-dbg|*-dbgsym)
                echo "Dropping debug-symbol package: $binary_package ($(basename "$deb"))"
                rm -f "$deb"
                ;;
              libdrm-amdgpu1|libdrm-radeon1)
                if [[ "$PACKAGE" == "libdrm" ]]; then
                  echo "Dropping non-Intel GPU package from the D630 libdrm release: $binary_package"
                  rm -f "$deb"
                else
                  FILTERED_DEBS+=("$deb")
                fi
                ;;
              *)
                FILTERED_DEBS+=("$deb")
                ;;
            esac
          done
          DEBS=("${FILTERED_DEBS[@]}")
          if (( ${#DEBS[@]} == 0 )); then
            echo "::error::No non-debug binary packages remain after filtering"
            exit 1
          fi
          if [[ "$PACKAGE" == "mesa" ]]; then
            dri_package_found=false
            for deb in "${DEBS[@]}"; do
              package_name="$(dpkg-deb -f "$deb" Package)"
              depends="$(dpkg-deb -f "$deb" Depends 2>/dev/null || true)"
              if grep -qw "libllvm15" <<<"$depends"; then
                echo "::error::LLVM-free Mesa artifact still depends on libllvm15: $package_name"
                exit 1
              fi
              if [[ "$package_name" == "mesa-opencl-icd" ]]; then
                echo "::error::Mesa no-LLVM release must omit mesa-opencl-icd; its runtime dependency chain restores LLVM."
                exit 1
              fi
              if [[ "$package_name" == "libgl1-mesa-dri" ]]; then
                dri_package_found=true
                if ! dpkg-deb --contents "$deb" | grep "/crocus_dri.so" >/dev/null; then
                  echo "::error::LLVM-free Mesa artifact omitted the required Intel Crocus Gallium driver"
                  exit 1
                fi
              fi
            done
            if [[ "$dri_package_found" != "true" ]]; then
              echo "::error::Mesa build did not produce libgl1-mesa-dri"
              exit 1
            fi
            echo "Verified Mesa package set keeps Crocus and has no libllvm15 runtime dependency."
          fi
          if [[ "$PACKAGE" == "libdrm" ]]; then
            libdrm2_found=false
            libdrm_intel_found=false
            for deb in "${DEBS[@]}"; do
              case "$(dpkg-deb -f "$deb" Package)" in
                libdrm2) libdrm2_found=true ;;
                libdrm-intel1) libdrm_intel_found=true ;;
                libdrm-amdgpu1|libdrm-radeon1)
                  echo "::error::Intel-only libdrm release unexpectedly contains $(dpkg-deb -f "$deb" Package)"
                  exit 1
                  ;;
              esac
            done
            if [[ "$libdrm2_found" != "true" || "$libdrm_intel_found" != "true" ]]; then
              echo "::error::libdrm build must retain both libdrm2 and libdrm-intel1 for the D630"
              exit 1
            fi
          fi
          if [[ "$PACKAGE" == "fftw3" ]]; then
            fftw_runtime_found=false
            for deb in "${DEBS[@]}"; do
              [[ "$(dpkg-deb -f "$deb" Package)" == "libfftw3-double3" ]] && fftw_runtime_found=true
            done
            if [[ "$fftw_runtime_found" != "true" ]]; then
              echo "::error::FFTW build did not produce required runtime package libfftw3-double3"
              exit 1
            fi
          fi

          for deb in "${DEBS[@]}"; do
            binary_package="$(dpkg-deb -f "$deb" Package)"
            binary_version="$(dpkg-deb -f "$deb" Version)"
            binary_arch="$(dpkg-deb -f "$deb" Architecture)"
            printf '%s %s %s %s\n' "$(basename "$deb")" "$binary_package" "$binary_version" "$binary_arch"
            if [[ "$PACKAGE" == "rust-sd" && "$binary_version" == "0.80.really.$PACKAGE_VERSION" ]]; then
              echo "::notice::Accepted Debian sd Cargo-generated binary version: $binary_version"
            elif [[ "$binary_version" != "$PACKAGE_VERSION" ]]; then
              echo "::error::Unexpected binary version for $binary_package: $binary_version (expected $PACKAGE_VERSION)"
              exit 1
            fi
            case "$binary_arch" in amd64|all) ;; *) echo "Unexpected architecture $binary_arch in $deb"; exit 1 ;; esac
            cp "$deb" "$GITHUB_WORKSPACE/release-artifacts/"
          done

          {
            printf '%s\n' \
              "Package: $PACKAGE" \
              "Debian Bookworm source version: $ORIGINAL_VERSION" \
              "Core 2 package version: $PACKAGE_VERSION" \
              "Target: amd64 / Intel Core 2" \
              "Optimization level: $CORE2_OPT_LEVEL" \
              "Build mode: $BUILD_MODE" \
              "Build source: official Debian Bookworm source package with Debian patches" \
              "Debian hardening: retained"
            printf '\nEffective compiler flags from dpkg-buildflags:\n'
            cat "$GITHUB_WORKSPACE/core2-build-flags.txt"
          } > "$GITHUB_WORKSPACE/release-artifacts/BUILD-INFO.txt"

      - name: Upload full build log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core2-${{ inputs.package }}-build-log-${{ github.run_id }}
          path: |
            ${{ inputs.package }}-build.log
            neovim-tested-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate package set and create checksums
        id: meta
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          PACKAGE_VERSION: ${{ steps.source.outputs.package_version }}
          SOURCE_VERSION: ${{ steps.source.outputs.source_version }}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/release-artifacts"
          shopt -s nullglob
          DEBS=( ./*.deb )
          if (( ${#DEBS[@]} == 0 )); then
            echo "::error::No Debian packages staged"
            exit 1
          fi
          # Cover every uploaded file (binary and source), not only .deb files.
          ASSETS_TO_SUM=()
          for asset in ./*; do
            [[ -f "$asset" ]] || continue
            [[ "${asset#./}" == "SHA256SUMS-core2-${PACKAGE}.txt" ]] && continue
            ASSETS_TO_SUM+=("${asset#./}")
          done
          if (( ${#ASSETS_TO_SUM[@]} == 0 )); then
            echo "::error::No release assets available to checksum"
            exit 1
          fi
          sha256sum "${ASSETS_TO_SUM[@]}" > "SHA256SUMS-core2-${PACKAGE}.txt"
          cat "SHA256SUMS-core2-${PACKAGE}.txt"

          TAG_VERSION="$(printf '%s' "$PACKAGE_VERSION" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
          RELEASE_TAG="core2-${PACKAGE}-${TAG_VERSION}"
          {
            echo "package_version=$PACKAGE_VERSION"
            echo "source_version=$SOURCE_VERSION"
            echo "release_tag=$RELEASE_TAG"
            echo "optimization_level=$CORE2_OPT_LEVEL"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag: $RELEASE_TAG"
          ls -lh ./*.deb ./*.txt

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core2-${{ inputs.package }}-${{ github.run_id }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Core 2 ${{ inputs.package }} packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: ${{ inputs.package }}
      SOURCE_VERSION: ${{ needs.build.outputs.source_version }}
      PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      OPT_LEVEL: ${{ needs.build.outputs.optimization_level }}
      BUILD_MODE: ${{ needs.build.outputs.build_mode }}
      RELEASE_KIND: optimized

    steps:
      - name: Checkout repository for the release index
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: core2-${{ inputs.package }}-${{ github.run_id }}
          path: dist

      - name: Publish package release
        shell: bash
        run: |
          set -euxo pipefail
          cd dist
          python3 "$GITHUB_WORKSPACE/core2-packages/release-notes.py"
          RELEASE_TITLE="$(cat release-title.txt)"
          cat release-notes.md
          rm -f release-title.txt

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists; refusing to overwrite or upload assets."
            exit 0
          else
            shopt -s nullglob
            ASSETS=( ./*.deb ./*.txt )
            if (( ${#ASSETS[@]} == 0 )); then
              echo "::error::No package files are available to publish."
              exit 1
            fi
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

      - name: Dispatch package index refresh
        if: ${{ inputs.refresh_index }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh workflow run d630-core2-update-release-index.yml --repo "$GITHUB_REPOSITORY" --ref master; then
            echo "Dispatched package index refresh."
          else
            echo "::warning::Package release was published, but index refresh could not be dispatched."
          fi
