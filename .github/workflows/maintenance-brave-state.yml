name: Consolidate Brave checkpoint state

on:
  push:
    paths:
      - .github/workflows/maintenance-brave-state.yml

permissions:
  actions: write
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Add safe compaction mode and run it
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path(".github/workflows/d630-core2-brave-source.yml")
          s = p.read_text()

          def replace(old, new, count=1, label="anchor"):
              global s
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f"{label}: found {actual}, expected {count}; refusing partial edit")
              s = s.replace(old, new)

          replace("""      version:
            description: Brave stable version (for example 1.97.59), or latest
            required: true
            default: latest
            type: string
          """, """      version:
            description: Brave stable version (for example 1.97.59), or latest
            required: true
            default: latest
            type: string
          compact_state:
            description: Consolidate checkpoint deltas into one verified full snapshot and prune old assets
            required: false
            default: false
            type: boolean
          """, label="workflow input")

          replace("""      - name: Compile Brave Release and build Linux package
            id: compile
          """, """      - name: Compile Brave Release and build Linux package
            if: inputs.compact_state != true
            id: compile
          """, label="compile condition")

          replace("        if: steps.compile.outputs.checkpoint != 'true'",
                  "        if: inputs.compact_state != true && steps.compile.outputs.checkpoint != 'true'",
                  label="package condition")
          replace("        if: success() && steps.compile.outputs.checkpoint != 'true'",
                  "        if: inputs.compact_state != true && success() && steps.compile.outputs.checkpoint != 'true'",
                  count=2, label="publish and final-cleanup conditions")
          replace("""      - name: Upload build logs and package artifacts
            if: always()""",
                  """      - name: Upload build logs and package artifacts
            if: always() && inputs.compact_state != true""",
                  label="artifact condition")

          replace("""        if: success() && steps.compile.outputs.checkpoint == 'true'
            shell: bash
            env:
              UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
              UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
              STATE_TAG: ${{ steps.state.outputs.state_tag }}""",
                  """        if: success() && (inputs.compact_state == true || steps.compile.outputs.checkpoint == 'true')
            shell: bash
            env:
              COMPACT_STATE: ${{ inputs.compact_state }}
              UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
              UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
              STATE_TAG: ${{ steps.state.outputs.state_tag }}""",
                  label="save checkpoint condition and environment")

          replace(r"""          if [[ "$LAST_CHECKPOINT" == "0000" ]]; then
            echo "Capturing complete output tree for the initial checkpoint."
            (cd "$OUT" && find . \( -type f -o -type l \) -print0) > "$FILE_LIST"
          else
            echo "Capturing files added or changed since checkpoint $LAST_CHECKPOINT."
            (cd "$OUT" && find . \( -type f -o -type l \) -newer "$BASELINE" -print0) > "$FILE_LIST"
          fi
          """,
                  r"""          if [[ "$COMPACT_STATE" == "true" || "$LAST_CHECKPOINT" == "0000" ]]; then
            if [[ "$COMPACT_STATE" == "true" ]]; then
              echo "Capturing a full output snapshot through checkpoint $LAST_CHECKPOINT."
            else
              echo "Capturing complete output tree for the initial checkpoint."
            fi
            (cd "$OUT" && find . \( -type f -o -type l \) -print0) > "$FILE_LIST"
          else
            echo "Capturing files added or changed since checkpoint $LAST_CHECKPOINT."
            (cd "$OUT" && find . \( -type f -o -type l \) -newer "$BASELINE" -print0) > "$FILE_LIST"
          fi
          """, label="full snapshot collection")

          replace(r"""          mapfile -t PARTS < <(find "$PART_DIR" -maxdepth 1 -type f -name "state-c${NEXT_CHECKPOINT}-part-*" -print | sort)
          if (( ${#PARTS[@]} == 0 )); then
            echo "::error::Checkpoint archive did not produce any parts."
            exit 1
          fi

          if ! gh release view""",
                  r"""          mapfile -t PARTS < <(find "$PART_DIR" -maxdepth 1 -type f -name "state-c${NEXT_CHECKPOINT}-part-*" -print | sort)
          if (( ${#PARTS[@]} == 0 )); then
            echo "::error::Checkpoint archive did not produce any parts."
            exit 1
          fi

          # Validate the compressed stream and tar archive before replacing old state.
          cat "${PARTS[@]}" | zstd -t
          cat "${PARTS[@]}" | zstd -d -c | tar -tf - >/dev/null

          if ! gh release view""", label="archive validation")

          replace("""          created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            EOF
            # The manifest is uploaded last; its presence means all parts were uploaded.
            gh release upload "$STATE_TAG" "$MANIFEST" --repo "$GITHUB_REPOSITORY"
            {
              echo "### Brave build checkpoint saved" """.rstrip(),
                  """          full_snapshot=$([[ "$COMPACT_STATE" == "true" || "$LAST_CHECKPOINT" == "0000" ]] && echo true || echo false)
            covers_through=$LAST_CHECKPOINT
            created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            EOF
            # The manifest is uploaded last; its presence means all parts were uploaded.
            gh release upload "$STATE_TAG" "$MANIFEST" --repo "$GITHUB_REPOSITORY"

            # Verify the remote snapshot before anything can be deleted.
            REMOTE_ASSETS="$RUNNER_TEMP/brave-state-remote-assets.txt"
            gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$REMOTE_ASSETS"
            grep -qx "state-c${NEXT_CHECKPOINT}-manifest.txt" "$REMOTE_ASSETS"
            REMOTE_PARTS="$(grep -Ec "^state-c${NEXT_CHECKPOINT}-part-[0-9]{3}$" "$REMOTE_ASSETS" || true)"
            if [[ "$REMOTE_PARTS" != "${#PARTS[@]}" ]]; then
              echo "::error::Remote checkpoint verification failed: expected ${#PARTS[@]} parts, found $REMOTE_PARTS."
              exit 1
            fi
            echo "part_count=${#PARTS[@]}" >> "$GITHUB_OUTPUT"

            {
              echo "### Brave build checkpoint saved" """.rstrip(),
                  label="manifest and remote verification")

          queue = """      - name: Queue the next Brave compilation session
            if: success() && steps.compile.outputs.checkpoint == 'true' && steps.save_state.outcome == 'success'"""
          prune = """      - name: Prune obsolete checkpoint deltas after full snapshot
            if: success() && inputs.compact_state == true && steps.save_state.outcome == 'success'
            shell: bash
            env:
              STATE_TAG: ${{ steps.state.outputs.state_tag }}
              PRESERVE_CHECKPOINT: ${{ steps.state.outputs.next_checkpoint }}
              EXPECTED_PARTS: ${{ steps.save_state.outputs.part_count }}
            run: |
              set -euo pipefail
              PART_DIR="$RUNNER_TEMP/brave-state-parts"
              MANIFEST="$PART_DIR/state-c${PRESERVE_CHECKPOINT}-manifest.txt"
              grep -qx 'full_snapshot=true' "$MANIFEST" || {
                echo "::error::The new checkpoint is not a full snapshot; preserving all previous checkpoints."
                exit 1
              }

              ASSETS="$RUNNER_TEMP/brave-state-cleanup-assets.tsv"
              gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.id, .name] | @tsv' > "$ASSETS"
              awk -F '\t' -v cp="$PRESERVE_CHECKPOINT" '$2 == "state-c" cp "-manifest.txt" {found=1} END {exit !found}' "$ASSETS" || {
                echo "::error::Remote snapshot manifest is missing; preserving all previous checkpoints."
                exit 1
              }
              ACTUAL_PARTS="$(awk -F '\t' -v cp="$PRESERVE_CHECKPOINT" '$2 ~ ("^state-c" cp "-part-[0-9][0-9][0-9]$") {n++} END {print n+0}' "$ASSETS")"
              if [[ "$ACTUAL_PARTS" != "$EXPECTED_PARTS" || "$EXPECTED_PARTS" == "0" ]]; then
                echo "::error::Remote snapshot parts are incomplete; preserving all previous checkpoints."
                exit 1
              fi

              while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
                if [[ "$ASSET_NAME" =~ ^state-c([0-9]{4})-(manifest\.txt|part-[0-9]{3})$ ]]; then
                  CP="${BASH_REMATCH[1]}"
                  if [[ "$CP" != "$PRESERVE_CHECKPOINT" ]]; then
                    echo "Deleting superseded checkpoint asset $ASSET_NAME"
                    gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
                  fi
                fi
              done < "$ASSETS"
              echo "Retained full snapshot checkpoint $PRESERVE_CHECKPOINT; removed older deltas."

          """
          replace(queue, prune + queue, label="insert cleanup step")

          p.write_text(s)
          print("Workflow patched:", p.stat().st_size, "bytes")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/d630-core2-brave-source.yml
          git rm .github/workflows/maintenance-brave-state.yml
          git diff --cached --check
          git commit -m "Add safe Brave checkpoint compaction and cleanup"
          git push origin HEAD:master

          gh workflow run d630-core2-brave-source.yml --repo "$REPOSITORY" --ref master -f version=1.97.59 -f compact_state=true
          echo "Compaction dispatched; prior checkpoints are deleted only after a full snapshot is verified."
