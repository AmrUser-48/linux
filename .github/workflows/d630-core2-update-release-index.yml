name: Refresh package releases, dependency tree and README
run-name: "Normalize releases + rebuild dependency tree and package index"

on:
  workflow_dispatch:
  # Also run once when the indexer itself changes, so its output path can be checked.
  push:
    branches: [master]
    paths:
      - ".github/workflows/d630-core2-update-release-index.yml"
      - "core2-packages/update-index.py"
      - "core2-packages/normalize-releases.py"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: core2-release-index-normalize-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: |
            core2-packages/README.md
            core2-packages/update-index.py
            core2-packages/normalize-releases.py
            core2-packages/dependency-metadata.json
          sparse-checkout-cone-mode: false

      - name: Rebuild expandable package dependency tree and downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git checkout -B master origin/master
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/core2-releases.json"

            # GITHUB_TOKEN-created releases may not trigger a release event.
            # Normalize titles/notes before rebuilding the README index.
            if python3 core2-packages/normalize-releases.py "$RUNNER_TEMP/core2-releases.json"; then
              echo "Release titles and notes normalized."
            else
              echo "::warning::Some release notes could not be normalized; continuing with the README refresh."
            fi
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/core2-releases.json"
            python3 core2-packages/update-index.py \
              "core2-packages/README.md" \
              "core2-packages/dependency-metadata.json" \
              "$RUNNER_TEMP/core2-releases.json"

            README_BYTES="$(wc -c < core2-packages/README.md)"
            echo "Generated package README size: ${README_BYTES} bytes"
            if (( README_BYTES > 950000 )); then
              echo "::error::Generated package README exceeds the 950 KB rendering budget."
              exit 1
            fi

            git add core2-packages/README.md core2-packages/dependency-metadata.json
            if git diff --cached --quiet; then
              echo "Release index is already current."
              exit 0
            fi
            git commit -m "Refresh Core 2 package release index"
            if git push origin HEAD:master; then
              echo "Release index updated."
              exit 0
            fi
            echo "::warning::master changed concurrently; retrying ($attempt/5)."
            git reset --hard
            sleep 2
          done

          echo "::error::Could not update release index after five attempts."
          exit 1
