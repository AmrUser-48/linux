name: Dispatch Brave state compaction once

on:
  push:
    paths:
      - .github/workflows/dispatch-brave-state-compaction.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch one compact-only session
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run d630-core2-brave-source.yml --repo "$REPOSITORY" --ref master -f version=1.97.59 -f compact_state=true
          echo "Queued one compact-only session."
