name: Cancel obsolete documentation-triggered kernel build

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/d630-kernel.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-kernel-build:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the kernel build from the root README-only commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/38040662820/cancel"
          echo "Cancellation requested for the documentation-triggered kernel build."
