name: Cancel duplicate Brave compaction dispatch

on:
  push:
    paths:
      - .github/workflows/stop-brave-run-31.yml

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel duplicate pending compaction
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run cancel 39972014585 --repo "$REPOSITORY" || true
          echo "Cancelled duplicate pending compaction if it had not started."
