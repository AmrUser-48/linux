name: Core 2 optimized SoX NG Debian package
run-name: "Core 2 SoX NG stable with native Opus encoder: ${{ inputs.source_ref || 'sox_ng-14.8.1' }}"

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/d630-core2-sox-ng.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Upstream SoX NG branch or tag
        required: true
        type: string
        default: sox_ng-14.8.1
      cflags_append:
        description: Space-separated C compiler flags appended to Debian defaults
        required: true
        type: string
        default: "-O2 -pipe -march=core2 -mtune=core2"
      cxxflags_append:
        description: Space-separated C++ compiler flags appended to Debian defaults
        required: true
        type: string
        default: "-O2 -pipe -march=core2 -mtune=core2"
      cppflags_append:
        description: Preprocessor flags appended to Debian defaults; empty is allowed
        required: false
        type: string
        default: ""
      ldflags_append:
        description: Linker flags appended to Debian defaults; empty is allowed
        required: false
        type: string
        default: ""
      configure_flags:
        description: Complete space-separated SoX NG configure options; replace this string to change options
        required: true
        type: string
        default: "--with-dyn-default --with-ffmpeg --with-curl --enable-replace --with-pkgconfigdir=no --docdir=/usr/share/doc/sox-ng"
      hardening_options:
        description: dpkg-buildflags hardening profile
        required: true
        type: string
        default: "hardening=+all"
      deb_build_options:
        description: DEB_BUILD_OPTIONS, for example noautodbgsym or nocheck
        required: true
        type: string
        default: "noautodbgsym"
      build_jobs:
        description: Number of parallel build jobs
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "4"
        default: "4"

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: Build and test SoX NG for Core 2
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: debian:12
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SOURCE_REF: ${{ inputs.source_ref || 'sox_ng-14.8.1' }}
      CFLAGS_APPEND: ${{ inputs.cflags_append || '-O2 -pipe -march=core2 -mtune=core2' }}
      CXXFLAGS_APPEND: ${{ inputs.cxxflags_append || '-O2 -pipe -march=core2 -mtune=core2' }}
      CPPFLAGS_APPEND: ${{ inputs.cppflags_append || '' }}
      LDFLAGS_APPEND: ${{ inputs.ldflags_append || '' }}
      SOX_NG_CONFIGURE_FLAGS: ${{ inputs.configure_flags || '--with-dyn-default --with-ffmpeg --with-curl --enable-replace --with-pkgconfigdir=no --docdir=/usr/share/doc/sox-ng' }}
      BUILD_JOBS: ${{ inputs.build_jobs || '4' }}
      DEB_CFLAGS_MAINT_APPEND: ${{ inputs.cflags_append || '-O2 -pipe -march=core2 -mtune=core2' }}
      DEB_CXXFLAGS_MAINT_APPEND: ${{ inputs.cxxflags_append || '-O2 -pipe -march=core2 -mtune=core2' }}
      DEB_CPPFLAGS_MAINT_APPEND: ${{ inputs.cppflags_append || '' }}
      DEB_LDFLAGS_MAINT_APPEND: ${{ inputs.ldflags_append || '' }}
      DEB_BUILD_MAINT_OPTIONS: ${{ inputs.hardening_options || 'hardening=+all' }}
      DEB_BUILD_OPTIONS: ${{ inputs.deb_build_options || 'noautodbgsym' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout package release metadata helper
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install Debian 12 build dependencies and all available codec development libraries
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake build-essential ca-certificates curl debhelper devscripts \
            dpkg-dev fakeroot file ffmpeg gh git ladspa-sdk libao-dev libasound2-dev \
            libcurl4-openssl-dev libebur128-dev libfftw3-dev libflac-dev libgsm1-dev \
            libid3tag0-dev libltdl-dev libmad0-dev libmagic-dev libmp3lame-dev \
            libogg-dev libopus-dev libopusenc-dev libopusfile-dev \
            libopencore-amrnb-dev libopencore-amrwb-dev libpng-dev libpulse-dev \
            libsndfile1-dev libsndio-dev libspeexdsp-dev libtool libtool-bin libtwolame-dev \
            libvorbis-dev libwavpack-dev pkg-config

      - name: Fetch upstream source and prepare Debian packaging
        id: source
        shell: bash
        run: |
          set -euxo pipefail
          if [[ ! "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid upstream ref: $SOURCE_REF"
            exit 1
          fi

          BUILD_ROOT="$GITHUB_WORKSPACE/build-work"
          mkdir -p "$BUILD_ROOT"
          SOURCE_DIR="$BUILD_ROOT/sox-ng-source"
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://codeberg.org/sox_ng/sox_ng.git "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          OPUS_ENCODER_COMMIT="ed26bb80b6b89065b597b46ff40ed2b42de8b89d"

          # Backport the upstream Opus writer into the stable 14.8.1 source.
          git fetch --no-tags --depth=1 origin "$OPUS_ENCODER_COMMIT"
          git show "$OPUS_ENCODER_COMMIT:src/opus.c" > /tmp/sox-ng-opus.c
          install -m 0644 /tmp/sox-ng-opus.c src/opus.c

          python3 - <<'PY'
          from pathlib import Path

          configure = Path("configure.ac")
          text = configure.read_text()
          needle = ' AC_CHECK_LIB(opusfile, op_open_callbacks, OPUS_LIBS="$OPUS_LIBS -lopusfile", using_opus=no, $OPUS_LIBS $OGG_VORBIS_LIBS)'
          if text.count(needle) != 1:
              raise SystemExit("Expected exactly one Opus libopusfile probe in configure.ac.")
          encoder_probe = '''
           AC_CHECK_LIB(opusenc, ope_encoder_create_pull,
            OPUS_LIBS="$OPUS_LIBS -lopusenc"
            AC_DEFINE([HAVE_OPUSENC], 1, [Define to 1 to use libopusenc]),
            using_opusenc=no, $OPUS_LIBS $OGG_VORBIS_LIBS)'''
          configure.write_text(text.replace(needle, needle + encoder_probe, 1))

          manpage = Path("soxformat_ng.7")
          text = manpage.read_text()
          old = "SoX can only read Opus files, not write them."
          new = r"SoX can read and write Opus files when built with libopusenc; \fB\-t sndfile\fR can only read them."
          if text.count(old) != 1:
              raise SystemExit("Expected stable Opus read-only note exactly once in soxformat_ng.7.")
          manpage.write_text(text.replace(old, new, 1))

          opus = Path("src/opus.c")
          text = opus.read_text()
          old = "lsx_fail(ope_strerror(retval));"
          new = 'lsx_fail("%s", ope_strerror(retval));'
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one vulnerable lsx_fail() call in {opus}, found {text.count(old)}")
          opus.write_text(text.replace(old, new, 1))
          if "ope_encoder_write_float" not in opus.read_text():
              raise SystemExit("Backported src/opus.c does not contain the Opus encoder.")
          PY

          git diff --check
          git diff -- src/opus.c configure.ac soxformat_ng.7
          echo "OPUS_ENCODER_COMMIT=$OPUS_ENCODER_COMMIT" >> "$GITHUB_ENV"

          autoreconf -fi

          UPSTREAM_VERSION="$(sed -n 's/^AC_INIT(\[sox_ng\], \[\([^]]*\)\].*/\1/p' configure.ac | head -n 1)"
          if [[ -z "$UPSTREAM_VERSION" ]]; then
            echo "::error::Could not extract upstream version from configure.ac"
            exit 1
          fi
          BUILD_STAMP="$(date -u +%Y%m%d%H%M%S)"
          PACKAGE_VERSION="${UPSTREAM_VERSION}+core2.1~${BUILD_STAMP}"
          BUILD_DATE="$(date -u -R)"

          mkdir -p debian/source
          cat > debian/control <<'EOF'
          Source: sox-ng
          Section: sound
          Priority: optional
          Maintainer: Core 2 package builder <noreply@example.invalid>
          Build-Depends:
           debhelper-compat (= 13),
           autoconf,
           automake,
           libtool,
           libtool-bin,
           pkg-config,
           ladspa-sdk,
           libao-dev,
           libasound2-dev,
           libcurl4-openssl-dev,
           libebur128-dev,
           libfftw3-dev,
           libflac-dev,
           libgsm1-dev,
           libid3tag0-dev,
           libltdl-dev,
           libmad0-dev,
           libmagic-dev,
           libmp3lame-dev,
           libogg-dev,
           libopus-dev,
           libopusenc-dev,
           libopusfile-dev,
           libopencore-amrnb-dev,
           libopencore-amrwb-dev,
           libpng-dev,
           libpulse-dev,
           libsndfile1-dev,
           libsndio-dev,
           libspeexdsp-dev,
           libtwolame-dev,
           libvorbis-dev,
           libwavpack-dev
          Standards-Version: 4.6.2
          Rules-Requires-Root: no

          Package: libsox-ng5
          Architecture: any
          Multi-Arch: same
          Pre-Depends: ${misc:Pre-Depends}
          Depends: ${shlibs:Depends}, ${misc:Depends}
          Description: SoX NG shared library and dynamic format handlers
           Shared runtime library and optional dynamically loaded format handlers
           built from upstream SoX NG for Intel Core 2.

          Package: sox-ng
          Architecture: any
          Depends: libsox-ng5 (= ${binary:Version}), ${shlibs:Depends}, ${misc:Depends}
          Recommends: ffmpeg, curl
          Conflicts: sox
          Replaces: sox
          Description: Swiss Army knife of sound processing (SoX NG)
           SoX NG command-line audio processing utility, optimized for Intel Core 2.
           The package provides the conventional sox, soxi, play, and rec command
           names while replacing Debian's non-NG sox package.
          EOF

          cat > debian/rules <<'EOF'
          #!/usr/bin/make -f

          %:
          	dh $@

          override_dh_auto_configure:
          	./debian/configure-wrapper

          override_dh_auto_install:
          	dh_auto_install --destdir=debian/tmp
          	rm -f debian/tmp/usr/lib/$(DEB_HOST_MULTIARCH)/libsox_ng.so debian/tmp/usr/lib/$(DEB_HOST_MULTIARCH)/libsox.so debian/tmp/usr/lib/$(DEB_HOST_MULTIARCH)/libsox_ng.a debian/tmp/usr/lib/$(DEB_HOST_MULTIARCH)/libsox.a
          	find debian/tmp/usr/lib -type f -name '*.la' -delete
          	find debian/tmp/usr/lib -type l -name '*.la' -delete
          	# Runtime-only package: no development headers, static API docs, or installed upstream docs.
          	rm -rf debian/tmp/usr/include debian/tmp/usr/share/man/man3
          	rm -rf debian/tmp/usr/share/doc/sox-ng

          override_dh_auto_test:
          	@echo "Upstream source-tree tests skipped; package-installed Opus tests run in CI."
          EOF
          chmod 755 debian/rules

          cat > debian/configure-wrapper <<'EOF'
          #!/bin/sh
          set -eu
          python3 - <<'PY'
          import os
          import shlex
          import subprocess

          options = shlex.split(os.environ.get("SOX_NG_CONFIGURE_FLAGS", ""))
          subprocess.run(["dh_auto_configure", "--", *options], check=True)
          PY
          EOF
          chmod 755 debian/configure-wrapper

          printf '%s\n' '3.0 (native)' > debian/source/format
          cat > debian/changelog <<EOF
          sox-ng (${PACKAGE_VERSION}) bookworm; urgency=medium

            * Build upstream SoX NG with Core 2 optimization and Debian hardening.
            * Enable dynamic optional format handlers and FFmpeg integration.
            * Verify native Opus encoding and decoding after package installation.

           -- Core 2 package builder <noreply@example.invalid>  ${BUILD_DATE}
          EOF

          cat > debian/libsox-ng5.install <<'EOF'
          usr/lib/*/libsox_ng.so.5*
          usr/lib/*/sox_ng/*
          EOF
          cat > debian/sox-ng.install <<'EOF'
          usr/bin/*
          usr/share/man/man1/*
          usr/share/man/man7/*
          EOF
          : > debian/sox-ng.docs
          for doc in INSTALL ChangeLog README README.md README-sox_ng.md COPYING; do
            [[ ! -f "$doc" ]] || printf '%s\n' "$doc" >> debian/sox-ng.docs
          done

          cat > debian/copyright <<'EOF'
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: SoX NG
          Source: https://codeberg.org/sox_ng/sox_ng

          Files: *
          Copyright: Copyright holders identified in the individual source files
          License: GPL-2+
           This program is free software; you can redistribute it and/or modify it
           under the terms of the GNU General Public License as published by the
           Free Software Foundation; either version 2 of the License, or (at your
           option) any later version.
           .
           This program is distributed in the hope that it will be useful, but
           WITHOUT ANY WARRANTY; without even the implied warranty of
           MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the GNU General
           Public License for more details.
           .
           On Debian systems, the complete text of the GNU General Public License
           version 2 can be found in /usr/share/common-licenses/GPL-2.
          EOF

          {
            echo "SOURCE_DIR=$SOURCE_DIR"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "UPSTREAM_VERSION=$UPSTREAM_VERSION"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
          } >> "$GITHUB_ENV"
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "upstream_version=$UPSTREAM_VERSION"
            echo "package_version=$PACKAGE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Compile and create Debian packages
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"

          CFLAGS="$(dpkg-buildflags --get CFLAGS)"
          CXXFLAGS="$(dpkg-buildflags --get CXXFLAGS)"
          CPPFLAGS="$(dpkg-buildflags --get CPPFLAGS)"
          LDFLAGS="$(dpkg-buildflags --get LDFLAGS)"
          {
            printf 'CFLAGS=%s\n' "$CFLAGS"
            printf 'CXXFLAGS=%s\n' "$CXXFLAGS"
            printf 'CPPFLAGS=%s\n' "$CPPFLAGS"
            printf 'LDFLAGS=%s\n' "$LDFLAGS"
            printf 'CFLAGS_APPEND=%s\n' "$CFLAGS_APPEND"
            printf 'CXXFLAGS_APPEND=%s\n' "$CXXFLAGS_APPEND"
            printf 'CPPFLAGS_APPEND=%s\n' "$CPPFLAGS_APPEND"
            printf 'LDFLAGS_APPEND=%s\n' "$LDFLAGS_APPEND"
            printf 'CONFIGURE_FLAGS=%s\n' "$SOX_NG_CONFIGURE_FLAGS"
            printf 'HARDENING_OPTIONS=%s\n' "$DEB_BUILD_MAINT_OPTIONS"
            printf 'DEB_BUILD_OPTIONS=%s\n' "$DEB_BUILD_OPTIONS"
            printf 'BUILD_JOBS=%s\n' "$BUILD_JOBS"
            printf '%s\n' 'Target: Debian 12 Bookworm amd64; Debian build flags retained'
          } > "$GITHUB_WORKSPACE/release-artifacts/CORE2-FLAGS.txt"

          check_flags() {
            local name="$1" requested="$2" actual="$3"
            local -a requested_flags actual_flags
            read -r -a requested_flags <<< "$requested"
            read -r -a actual_flags <<< "$actual"
            for flag in "${requested_flags[@]}"; do
              local found=false
              for actual_flag in "${actual_flags[@]}"; do
                if [[ "$actual_flag" == "$flag" ]]; then found=true; break; fi
              done
              if [[ "$found" != true ]]; then
                echo "::error::$name does not contain requested flag: $flag"
                exit 1
              fi
            done
          }
          check_flags CFLAGS "$CFLAGS_APPEND" "$CFLAGS"
          check_flags CXXFLAGS "$CXXFLAGS_APPEND" "$CXXFLAGS"
          check_flags CPPFLAGS "$CPPFLAGS_APPEND" "$CPPFLAGS"
          check_flags LDFLAGS "$LDFLAGS_APPEND" "$LDFLAGS"

          BUILD_USER=core2build
          if ! id "$BUILD_USER" >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash "$BUILD_USER"
          fi
          chown -R "$BUILD_USER:$BUILD_USER" "$GITHUB_WORKSPACE/build-work"
          runuser --preserve-environment --user "$BUILD_USER" -- env \
            HOME="/home/$BUILD_USER" USER="$BUILD_USER" LOGNAME="$BUILD_USER" \
            dpkg-buildpackage -rfakeroot -b -uc -us -j"$BUILD_JOBS"

          shopt -s nullglob
          DEBS=( "$GITHUB_WORKSPACE/build-work"/*.deb )
          if (( ${#DEBS[@]} == 0 )); then
            echo "::error::No Debian packages were produced."
            exit 1
          fi
          FOUND_SOX=false
          FOUND_LIB=false
          for deb in "${DEBS[@]}"; do
            arch="$(dpkg-deb -f "$deb" Architecture)"
            test "$arch" = amd64
            case "$(dpkg-deb -f "$deb" Package)" in
              sox-ng) FOUND_SOX=true ;;
              libsox-ng5) FOUND_LIB=true ;;
            esac
            cp "$deb" "$GITHUB_WORKSPACE/release-artifacts/"
          done
          if [[ "$FOUND_SOX" != true || "$FOUND_LIB" != true ]]; then
            echo "::error::Required sox-ng and libsox-ng5 runtime packages were not both produced."
            exit 1
          fi

          if ! grep -q 'ope_encoder_write_float' src/opus.c ||
             ! grep -q '^#define HAVE_OPUSENC 1' src/soxconfig.h; then
            echo "::error::Native Opus encoder is not enabled; refusing to package a decoder-only build."
            grep -E 'opus|HAVE_OPUSENC' config.log | tail -n 60 || true
            exit 1
          fi
          SOX_NG_HAS_OPUS_ENCODER=true
          printf 'Native Opus encoder: enabled (HAVE_OPUSENC=1)\n' \
            >> "$GITHUB_WORKSPACE/release-artifacts/CORE2-FLAGS.txt"
          echo "SOX_NG_HAS_OPUS_ENCODER=true" >> "$GITHUB_ENV"

          cd "$GITHUB_WORKSPACE/release-artifacts"
          sha256sum ./*.deb > SHA256SUMS-core2-sox-ng.txt
          printf 'Upstream: https://codeberg.org/sox_ng/sox_ng\nStable source ref: %s\nStable source commit: %s\nOpus encoder backport commit: %s\nUpstream version: %s\nDebian package version: %s\nTarget: amd64 / Intel Core 2\nNative Opus encoder: %s\n' \
            "$SOURCE_REF" "$SOURCE_COMMIT" "$OPUS_ENCODER_COMMIT" "$UPSTREAM_VERSION" "$PACKAGE_VERSION" "$SOX_NG_HAS_OPUS_ENCODER" \
            > BUILD-INFO.txt
          ls -lh ./*.deb ./*.txt

      - name: Verify package metadata and dynamic Opus module
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/release-artifacts"
          SOX_DEB=( ./sox-ng_*.deb )
          LIB_DEB=( ./libsox-ng5_*.deb )
          test "${#SOX_DEB[@]}" -eq 1
          test "${#LIB_DEB[@]}" -eq 1
          test "$(dpkg-deb -f "${SOX_DEB[0]}" Package)" = sox-ng
          test "$(dpkg-deb -f "${SOX_DEB[0]}" Conflicts)" = sox
          test "$(dpkg-deb -f "${SOX_DEB[0]}" Replaces)" = sox
          if [[ " $SOX_NG_CONFIGURE_FLAGS " == *" --with-dyn-default "* ]]; then
            dpkg-deb -c "${LIB_DEB[0]}" > /tmp/libsox-ng5-contents.txt
            grep -q 'libsox_ng_fmt_opus\.so' /tmp/libsox-ng5-contents.txt
          fi
          apt-get install -y "${LIB_DEB[0]}" "${SOX_DEB[0]}"

          if [[ " $SOX_NG_CONFIGURE_FLAGS " == *" --enable-replace "* ]]; then
            SOX_CMD=sox
            SOXI_CMD=soxi
            test -x /usr/bin/sox_ng
            test -L /usr/bin/sox
            test "$(readlink -f /usr/bin/sox)" = /usr/bin/sox_ng
          else
            SOX_CMD=sox_ng
            SOXI_CMD=soxi_ng
            test -x /usr/bin/sox_ng
          fi
          "$SOX_CMD" --version
          "$SOX_CMD" --help >/dev/null

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          "$SOX_CMD" -n -r 48000 -c 2 -b 16 "$TEST_DIR/input.wav" synth 0.5 sine 440
          "$SOX_CMD" "$TEST_DIR/input.wav" "$TEST_DIR/encoded.opus"
          "$SOX_CMD" "$TEST_DIR/encoded.opus" "$TEST_DIR/decoded.wav"
          test -s "$TEST_DIR/encoded.opus"
          test -s "$TEST_DIR/decoded.wav"
          "$SOXI_CMD" "$TEST_DIR/encoded.opus"
          echo "PASS: configured command names, native SoX NG Opus encoder, and Opus decoder."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core2-sox-ng-${{ github.run_id }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish Core 2 SoX NG release
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="$(printf '%s' "$PACKAGE_VERSION" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
          RELEASE_TAG="core2-system-sox-ng-${TAG_VERSION}"
          cd "$GITHUB_WORKSPACE/release-artifacts"
          cat > release-details.md <<EOF
          ## SoX NG build-specific details

          - Stable upstream source: SoX NG ${UPSTREAM_VERSION}, ref ${SOURCE_REF}, commit ${SOURCE_COMMIT}.
          - Native Opus encoder backport: upstream commit ${OPUS_ENCODER_COMMIT}.
          - CI installed the package and verified direct SoX NG WAV-to-Opus encoding followed by Opus-to-WAV decoding; FFmpeg was not used for encoding.
          - Conventional commands: `sox`, `soxi`, `play`, and `rec`.
          - Configure options: ${SOX_NG_CONFIGURE_FLAGS}
          - Dynamic format handlers: enabled by `--with-dyn-default`; this changes where handlers are loaded but does not guarantee a smaller total installed footprint.
          - Build jobs: ${BUILD_JOBS}; `DEB_BUILD_OPTIONS=${DEB_BUILD_OPTIONS}`.
          EOF

          export PACKAGE=sox-ng
          export SOURCE_VERSION="$UPSTREAM_VERSION"
          export RELEASE_KIND=system
          export OPT_LEVEL=-O2
          export BUILD_MODE="stable upstream release with native Opus encoder backport"
          export COMPILER_PROFILE="$CFLAGS_APPEND"
          export RELEASE_DETAILS_FILE="$GITHUB_WORKSPACE/release-artifacts/release-details.md"
          python3 "$GITHUB_WORKSPACE/core2-packages/release-notes.py"
          RELEASE_TITLE="$(cat release-title.txt)"
          rm -f release-title.txt
          gh release create "$RELEASE_TAG" ./*.deb ./*.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md

          if gh workflow run d630-core2-update-release-index.yml \
            --repo "$GITHUB_REPOSITORY" --ref master; then
            echo "Dispatched Core 2 package index refresh."
          else
            echo "::warning::Release published; package index refresh could not be dispatched."
          fi
