name: Force stop stale Brave build once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/force-stop-brave-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  force-cancel:
    name: Force-cancel stale Brave run #76
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Force cancellation and report status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel 40616100098 --repo "$GITHUB_REPOSITORY" --force
          for attempt in 1 2 3 4 5 6; do
            status="$(gh run view 40616100098 --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
            echo "Brave run #76 status=$status"
            [[ "$status" == "completed" ]] && exit 0
            sleep 2
          done
          echo "::warning::GitHub still reports the Brave run as active after force-cancel."
