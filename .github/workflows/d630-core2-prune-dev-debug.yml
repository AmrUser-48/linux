name: Prune Core 2 development and debug package assets
run-name: "Prune Core 2 -dev/-dbg/-dbgsym release assets"

on:
  workflow_dispatch:
  push:
    paths:
      - ".ci/core2-prune-dev-debug-trigger.txt"

permissions:
  contents: write

jobs:
  prune-release-assets:
    name: Remove forbidden Core 2 release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove old development/debug Debian packages from Core 2 releases
        shell: bash
        run: |
          set -euo pipefail

          # The app and system package releases in this repository use core2-*
          # tags. Only remove Debian binary assets whose actual package name
          # ends in -dev, -dbg or -dbgsym; leave runtime packages and metadata.
          asset_list="$RUNNER_TEMP/core2-release-assets.tsv"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("core2-")) | .tag_name as $tag | .assets[] | [$tag, .name] | @tsv' \
            > "$asset_list"

          removed=0
          while IFS=$'\t' read -r tag asset; do
            [[ -n "$tag" && -n "$asset" ]] || continue
            [[ "$asset" == *.deb ]] || continue
            binary_package="${asset%%_*}"
            case "$binary_package" in
              *-dev|*-dbg|*-dbgsym)
                echo "Removing $binary_package from release $tag"
                gh release delete-asset "$tag" "$asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
                removed=$((removed + 1))
                ;;
            esac
          done < "$asset_list"

          {
            echo "## Core 2 package release cleanup complete"
            echo
            echo "- Removed ${removed} development/debug package asset(s)."
            echo "- Matching packages: names ending in `-dev`, `-dbg`, or `-dbgsym`."
            echo "- Normal runtime packages and release metadata were preserved."
          } >> "$GITHUB_STEP_SUMMARY"
