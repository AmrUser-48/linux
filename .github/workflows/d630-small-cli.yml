name: Build compact Core 2 Codex CLI
run-name: "Core2 Codex: ${{ inputs.codex_ref || 'latest' }}"

on:
  workflow_dispatch:
    inputs:
      codex_ref:
        description: "Codex upstream ref: latest or a tag such as rust-v0.163.0"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build stripped Codex for Core 2 / Debian 12
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates cmake curl file git jq \
            musl-tools pkg-config protobuf-compiler zstd

      - name: Resolve Codex source ref
        id: resolve
        env:
          REF_INPUT: ${{ inputs.codex_ref || 'latest' }}
        shell: bash
        run: |
          set -euo pipefail
          REF="$REF_INPUT"
          if [[ "$REF" == "latest" ]]; then
            REF="$(curl -fsSL --retry 3 https://api.github.com/repos/openai/codex/releases/latest | jq -er '.tag_name')"
          fi
          if [[ ! "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid upstream ref: $REF"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch official Codex source
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: git clone --depth 1 --branch "$REF" https://github.com/openai/codex.git codex-src

      - name: Read upstream-pinned Rust toolchain
        id: rustver
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' codex-src/codex-rs/rust-toolchain.toml | head -n 1)"
          if [[ -z "$TOOLCHAIN" ]]; then
            echo "::error::Could not read the Rust toolchain pinned by Codex"
            exit 1
          fi
          echo "version=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain and static musl target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rustver.outputs.version }}
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codex-cargo-${{ runner.os }}-${{ steps.resolve.outputs.ref }}
          restore-keys: |
            codex-cargo-${{ runner.os }}-

      - name: Build and test the standalone Codex executable
        working-directory: codex-src/codex-rs
        env:
          CODEX_REF: ${{ steps.resolve.outputs.ref }}
          RUSTFLAGS: "-C target-cpu=core2 -C strip=symbols"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CFLAGS_x86_64_unknown_linux_musl: "-O2 -pipe -march=core2 -mtune=core2"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-unknown-linux-musl -p codex-cli --bin codex
          BIN="target/x86_64-unknown-linux-musl/release/codex"
          test -s "$BIN"
          strip --strip-unneeded "$BIN"
          "$BIN" --version
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class:|Machine:'
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::Codex musl binary has an ELF interpreter; expected a self-contained executable"
            exit 1
          fi
          if readelf -d "$BIN" 2>/dev/null | grep -q NEEDED; then
            echo "::error::Codex musl binary has dynamic-library dependencies"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/out/codex-payload"
          install -m 0755 "$BIN" "$GITHUB_WORKSPACE/out/codex-payload/codex"
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner \
            -I 'zstd -12 -T0' \
            -cf "$GITHUB_WORKSPACE/out/codex-linux-amd64-core2-musl.tar.zst" \
            -C "$GITHUB_WORKSPACE/out/codex-payload" codex
          {
            printf 'upstream_ref=%s\n' "$CODEX_REF"
            printf 'source_commit=%s\n' "$(git -C "$GITHUB_WORKSPACE/codex-src" rev-parse HEAD)"
            printf 'version=%s\n' "$("$BIN" --version)"
            printf 'rust=%s\n' "$(rustc --version)"
            printf 'target=x86_64-unknown-linux-musl\nRUSTFLAGS=-C target-cpu=core2 -C strip=symbols\n'
            printf 'CFLAGS=-O2 -pipe -march=core2 -mtune=core2\n'
            printf 'binary_bytes=%s\n' "$(stat -c %s "$BIN")"
          } > "$GITHUB_WORKSPACE/out/BUILD-INFO.txt"
          (cd "$GITHUB_WORKSPACE/out" && sha256sum codex-linux-amd64-core2-musl.tar.zst > SHA256SUMS)
          ls -lh "$GITHUB_WORKSPACE/out/codex-linux-amd64-core2-musl.tar.zst" "$BIN"
          cat "$GITHUB_WORKSPACE/out/BUILD-INFO.txt"
          cat "$GITHUB_WORKSPACE/out/SHA256SUMS"

      - name: Publish Codex-only release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core2-codex-${{ github.run_id }}
          name: "Codex CLI for Core 2: ${{ steps.resolve.outputs.ref }}"
          target_commitish: ${{ github.sha }}
          make_latest: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            out/codex-linux-amd64-core2-musl.tar.zst
            out/BUILD-INFO.txt
            out/SHA256SUMS
          body: |
            Standalone Codex CLI for Debian 12 on x86_64 Core 2 systems.
            Built from official OpenAI Codex source with Rust target-cpu=core2, musl static linking, release LTO, and stripped symbols.
            The workflow checks codex --version, ELF architecture, and the absence of an ELF interpreter or dynamic-library dependencies.
            SHA256SUMS verifies the compressed archive; BUILD-INFO.txt records the source ref, commit, and compiler settings.
            Extract the archive and copy codex to ~/.local/bin or another directory on PATH.
