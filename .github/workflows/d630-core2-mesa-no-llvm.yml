name: Build D630 Mesa without LLVM
run-name: "D630 Mesa no-LLVM | Core 2 -O3 flags | optimized linker flags"

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/d630-core2-mesa-no-llvm.yml"
      - ".github/workflows/d630-core2-package.yml"
  workflow_dispatch:

permissions:
  contents: read

# The reusable package workflow's SOURCE_PACKAGE=mesa profile applies and audits:
# -O3 -march=core2 -mtune=core2 -pipe -fomit-frame-pointer -ftree-vectorize
# and -Wl,-O1 -Wl,--as-needed, while retaining Debian hardening flags.
# Editing this workflow intentionally triggers a fresh no-LLVM Mesa rebuild on master.

jobs:
  mesa:
    name: Force-build corrected Mesa package set
    uses: ./.github/workflows/d630-core2-package.yml
    with:
      package: mesa
      force_rebuild: true
      refresh_index: true
    permissions:
      actions: write
      contents: write
